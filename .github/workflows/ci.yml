# Standard CI for a code repo. Copy to .github/workflows/ci.yml, keep the job names, and
# edit only the steps of `check` (and the filters, if the repo's layout differs).
#
# Branch protection on the default branch then requires exactly two checks:
#   ci-ok       (this file's summary job: skipped jobs count as passed, a failed one fails it)
#   sol-review  (posted by review-pr on AGREE)
# so nothing, not even a hand merge, gets past a red check or a missing review.
#
# Lanes: a public repo, so the repo variable CI_RUNS_ON is "ubuntu-latest" (free for public repos; Hunter's CI
# machines never serve public repos). Plain Python with no packages, so the checks are a compile and unittest.
#
# Runner: the build asks for hunter-ci, a fresh VM on one of the CI machines that homelab
# fleet/machines.yaml lists (`~/homelab/fleet/bin/ci-hosts` shows them), else boat. Every job uses
# it: GitHub-hosted runners are refused on Hunter's private repos (billing). A fork PR (public repos
# only) gets ubuntu-latest, which is free there. Set the repo variable CI_RUNS_ON to change it.
# Mac or iPhone tests: only on a mini runner Hunter approved for this repo (`ci-hosts` lists them);
# add a job with `runs-on: ${{ fromJSON(vars.MAC_RUNS_ON) }}` and `if: github.event.pull_request.head.repo.fork != true`.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"  # nightly full suite, since a PR runs only the tests its change touches
  # No merge_group: GitHub's merge queue needs Enterprise Cloud for private repos, and land-pr
  # merges on green instead.

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || vars.CI_RUNS_ON || '["self-hosted","hunter-ci"]') }}
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # A file counts as code unless it is documentation.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE*'
            db:
              - '**/migrations/**/*.sql'

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # A PR from a fork never runs on the MSI: its code is untrusted.
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || vars.CI_RUNS_ON || '["self-hosted","hunter-ci"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Fast checks first so a typo fails in seconds.
      - run: python -m py_compile server/lanes
      - run: python -m unittest discover -s tests -v

  test-quality:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || vars.CI_RUNS_ON || '["self-hosted","hunter-ci"]') }}
    timeout-minutes: 30
    env:
      BASE_REF: ${{ github.base_ref }}
      TEST_CMD: ${{ vars.TEST_CMD || 'python -m unittest discover -s tests' }}            # whole suite, for planted bugs
      TEST_FILE_CMD: ${{ vars.TEST_FILE_CMD || 'python -m unittest {files}' }}            # given test files
      MUTATION_MIN: ${{ vars.MUTATION_MIN || '50' }}
      MUTATION_INCLUDE: ${{ vars.MUTATION_INCLUDE }}               # regex of paths unit tests cover
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # .github/scripts/test-quality.mjs, copied from the land-pr skill, run as it is on the base
      # branch so a PR cannot weaken the checker that judges it (the PR's copy only on first adoption).
      # A PR line "Test changes: <why>" lets a deliberate test change through, with the reason shown.
      - name: Load the checker from the base branch
        run: git show "origin/$BASE_REF:.github/scripts/test-quality.mjs" > "$RUNNER_TEMP/tq.mjs" 2>/dev/null || cp .github/scripts/test-quality.mjs "$RUNNER_TEMP/tq.mjs"
      - name: No deleted, skipped or weakened tests
        run: node "$RUNNER_TEMP/tq.mjs" guard
      - name: New tests fail on the code before the PR
        run: node "$RUNNER_TEMP/tq.mjs" fail-first
      - name: Tests catch planted bugs in the changed code
        run: node "$RUNNER_TEMP/tq.mjs" mutation

  migrations:
    needs: changes
    if: needs.changes.outputs.db == 'true' && github.event_name == 'pull_request'
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || vars.CI_RUNS_ON || '["self-hosted","hunter-ci"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Lints only the migrations this PR adds. It fails on changes that break the running app
      # (drops, renames, type changes, new NOT NULL columns); style and big-table rules are off.
      - env:
          SQUAWK_OFF: prefer-robust-stmts,require-concurrent-index-creation,require-lock-timeout,require-statement-timeout,prefer-bigint-over-int,prefer-bigint-over-smallint,prefer-identity,prefer-text-field,prefer-timestamptz,adding-field-with-default,ban-char-field
        run: |
          files=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}"...HEAD -- ':(glob)**/migrations/**/*.sql')
          [ -z "$files" ] || npx --yes squawk-cli@2.70.0 --exclude="$SQUAWK_OFF" $files

  ci-ok:
    if: always()
    needs: [changes, check, test-quality, migrations]
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || vars.CI_RUNS_ON || '["self-hosted","hunter-ci"]') }}
    timeout-minutes: 2
    steps:
      # Passes when every job passed or was skipped by its filter; fails on failure or cancel.
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
