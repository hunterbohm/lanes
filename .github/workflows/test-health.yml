# Weekly test health. Copy to .github/workflows/test-health.yml next to ci.yml.
# Lists the slowest tests and the tests that catch none of the planted bugs in one issue
# ("Weekly test health", label test-health). An agent turns it into one reviewed cleanup PR.
name: Test health

on:
  schedule:
    - cron: "0 10 * * 1"  # Mondays
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","hunter-ci"]') }}
    timeout-minutes: 120
    env:
      TEST_CMD: ${{ vars.TEST_CMD || 'python -m unittest discover -s tests' }}
      MUTATION_INCLUDE: ${{ vars.MUTATION_INCLUDE }}
      TEST_FILE_CMD: ${{ vars.TEST_FILE_CMD }}
      # One run of the suite that writes JUnit XML to junit.xml, for test durations.
      TEST_JUNIT_CMD: ${{ vars.TEST_JUNIT_CMD || 'python -m unittest discover -s tests' }}   # no JUnit XML: durations are skipped
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: sh -c "$TEST_JUNIT_CMD" || true
      - run: node .github/scripts/test-quality.mjs mutation --all --out=mutation.json || true
      - run: node .github/scripts/test-quality.mjs report --junit=junit.xml --mutation=mutation.json
