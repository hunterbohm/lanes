<!doctype html>
<!-- Lanes: the charts page. `lanes hub` serves it at / and its data at /status.json. The Lanes menu bar app shows it
     (?in=menubar). It also works in any browser tab, or in an iframe inside another app (?in=embed). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanes</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #8a8984;
    --grid: #e6e5e1;
    --track: #ecebe7;
    --hover: rgba(0, 0, 0, .04);
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
    --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
    --good: #0ca30c;
    --bad: #d03b3b;
    --warn: #fab219;
    --gone: #b9b8b2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
      --grid: #2f2f2d; --track: #2a2a28; --hover: rgba(255, 255, 255, .05); --gone: #55544f;
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
      --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
    --grid: #2f2f2d; --track: #2a2a28; --hover: rgba(255, 255, 255, .05); --gone: #55544f;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--ink); }
  html.standalone body { background: var(--surface); min-height: 100vh; }
  html.standalone #app { max-width: 560px; margin: 0 auto; }
  html.menubar body { background: color-mix(in srgb, var(--surface) 86%, transparent); min-height: 100vh; }
  body { font: 12px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
         padding: 16px 18px 18px; -webkit-font-smoothing: antialiased; cursor: default; user-select: none; }
  a { color: inherit; text-decoration: none; }
  section { margin-top: 20px; }
  h2 { margin: 0 0 9px; font-size: 11px; font-weight: 600; color: var(--ink-2); display: flex; align-items: baseline; gap: 8px; }
  h2 .aside { font-weight: 400; color: var(--ink-3); margin-left: auto; }
  .head { display: flex; align-items: flex-end; gap: 10px; }
  .hero { font-size: 46px; font-weight: 600; line-height: .9; letter-spacing: -0.03em; }
  .hero-label { color: var(--ink-2); padding-bottom: 3px; line-height: 1.3; }
  .hero-label b { color: var(--ink); font-weight: 600; }
  .legend { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 10px; color: var(--ink-2);
            padding-bottom: 3px; font-size: 11px; max-width: 60%; }
  .key { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .fresh { color: var(--ink-3); font-size: 11px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .fresh.stale { color: var(--bad); }
  svg { display: block; overflow: visible; max-width: 100%; height: auto; }
  svg text { fill: var(--ink-3); font-size: 10px; font-variant-numeric: tabular-nums; }
  .mcard { padding: 12px 0; position: relative; }
  .mcard + .mcard::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--grid); }
  .mcard:first-child { padding-top: 2px; }
  .mhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
  .mname { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; white-space: nowrap; }
  .chip { font-size: 11px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip.hot { color: #fff; background: var(--bad); font-weight: 600; padding: 1px 7px; border-radius: 9px; }
  .mhead .slots { flex: none; height: 7px; }
  .mmeta { color: var(--ink-3); font-size: 11px; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mmeta.err { color: var(--bad); white-space: normal; }
  .mmeta.warn { color: var(--ink-2); }
  .tiles4 { display: grid; gap: 6px; margin-top: 9px; }
  @media (max-width: 400px) { .tiles4 { grid-template-columns: 1fr 1fr !important; } .mhead .slots { display: none; } }
  .tile { border: 1px solid var(--grid); border-radius: 8px; padding: 6px 8px 5px; min-width: 0; }
  .tile.hot { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, transparent); }
  .tile .lab { display: flex; justify-content: space-between; gap: 4px; font-size: 10.5px; color: var(--ink-3); }
  .tile .lab .flag { font-weight: 600; color: var(--bad); }
  .tile .lab .flag.warm { color: var(--ink-2); }
  .tile .lab .flag.info { color: var(--ink-3); font-weight: 400; }
  .tile .val { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .tile .val small { font-size: 11px; font-weight: 500; color: var(--ink-3); margin-left: 1px; }
  .tile .sub { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .tile svg { margin-top: 4px; width: 100%; height: 24px; }
  .tile.none .val { color: var(--ink-3); }
  .procs { display: grid; grid-template-columns: minmax(0, 1fr) 90px 34px; column-gap: 8px; row-gap: 3px; align-items: center;
           margin-top: 8px; font-size: 11px; font-variant-numeric: tabular-nums; }
  .procs .pl { grid-column: 1 / -1; color: var(--ink-3); font-size: 10.5px; }
  .procs .pn { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--ink-2); }
  .procs .pv { text-align: right; color: var(--ink-2); }
  .procs .meter { height: 6px; }
  .vrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; align-items: center; margin-top: 7px; }
  .heat { margin-top: 10px; padding: 7px 10px; border-radius: 8px; font-size: 11.5px; line-height: 1.5; color: var(--ink);
          background: color-mix(in srgb, var(--bad) 12%, transparent); border-left: 3px solid var(--bad); }
  .heat b { color: var(--bad); }
  .slots { display: flex; gap: 2px; height: 8px; }
  .slots i { flex: 1; border-radius: 2px; background: var(--track); }
  .meter { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 4px; }
  .run { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; column-gap: 9px; row-gap: 4px; align-items: center;
         padding: 6px 6px; margin: 0 -6px; border-radius: 6px; }
  .run { position: relative; }
  .run + .run::before { content: ''; position: absolute; left: 6px; right: 6px; top: 0; height: 1px; background: var(--grid); }
  .run[href]:hover::before, .run[href]:hover + .run::before { background: transparent; }
  .run[href]:hover { background: var(--hover); }
  .run .what { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .run .what b { font-weight: 600; }
  .run .what span { color: var(--ink-2); }
  .run .when { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 11px; }
  .run .bar { grid-column: 2 / 4; height: 3px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .run .bar i { display: block; height: 100%; border-radius: 2px; transition: width .6s ease; }
  .empty { color: var(--ink-3); padding: 4px 0; }
  .tally { display: flex; gap: 12px; color: var(--ink-2); font-size: 11px; margin-bottom: 9px; font-variant-numeric: tabular-nums; }
  .tally b { color: var(--ink); font-weight: 600; }
  .ok-i { color: var(--good); } .bad-i { color: var(--bad); }
  .tiles { display: flex; flex-wrap: wrap; gap: 2px; }
  .tiles a, .tiles span { width: 7px; height: 7px; border-radius: 2px; }
  .tiles a:hover, .tiles span:hover { outline: 1.5px solid var(--ink); outline-offset: 1px; }
  #tip { position: fixed; z-index: 10; pointer-events: none; max-width: 270px; padding: 7px 9px; border-radius: 7px; font-size: 11px;
         line-height: 1.45; white-space: pre-line; background: var(--ink); color: var(--surface); opacity: 0; transition: opacity .1s;
         box-shadow: 0 4px 16px rgba(0, 0, 0, .25); }
  #tip b { font-weight: 600; }
  .problem { padding: 28px 4px; text-align: center; color: var(--ink-2); line-height: 1.5; }
  .problem b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 4px; }
  @keyframes breathe { 0%, 100% { opacity: .3; } 50% { opacity: .85; } }
  .live { animation: breathe 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .live { animation: none; } .run .bar i { transition: none; } }
  /* ---- compact layout: the menu bar panel and the T3 card */
  .c-head { display: flex; align-items: flex-start; gap: 10px; }
  .c-title { font-size: 13px; font-weight: 600; line-height: 1.35; }
  .c-title.bad { color: var(--bad); }
  .c-sub { color: var(--ink-3); font-size: 11px; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .c-head .fresh { margin: 2px 0 0 auto; white-space: nowrap; }
  .c-label { font-size: 11px; font-weight: 600; color: var(--ink-2); margin: 16px 0 4px; display: flex; gap: 8px; }
  .c-label span:last-child { margin-left: auto; font-weight: 400; }
  .mt, .mt-cols { margin: 0 -8px; }
  .mt-cols, .mt-row { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 54px) 12px; column-gap: 10px; align-items: center; padding: 0 8px; }
  .mt-cols { font-size: 10px; color: var(--ink-3); padding-bottom: 2px; }
  .mt-cols span { text-align: right; }
  .mt-row { padding-top: 7px; padding-bottom: 7px; border-radius: 7px; cursor: pointer; }
  .mt-row:hover { background: var(--hover); }
  .mt-row:focus-visible { outline: 2px solid var(--c1); outline-offset: -2px; }
  .mt-name { min-width: 0; }
  .mt-name .mname { font-size: 12.5px; }
  .mt-why { color: var(--ink-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 1px 0 0 14px; }
  .cell { text-align: right; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cell.na { color: var(--gone); font-weight: 400; }
  .cell.bad { color: var(--bad); }
  .cell i { display: block; height: 3px; border-radius: 2px; background: var(--track); margin-top: 3px; overflow: hidden; }
  .cell i b { display: block; height: 100%; border-radius: 2px; }
  .chev { color: var(--ink-3); font-size: 10px; transition: transform .15s; text-align: center; }
  .open .chev { transform: rotate(90deg); }
  .mt-more { padding: 2px 8px 12px 22px; }
  .mt-more .kv { color: var(--ink-3); font-size: 11px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .multi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 8px 0 4px; }
  .multi .lab { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .multi .lab b { color: var(--ink-2); font-weight: 600; }
  .multi svg { width: 100%; height: 28px; margin-top: 2px; }
  .mt + .mt { border-top: 1px solid var(--grid); }
  .ci-line { display: flex; gap: 12px; color: var(--ink-2); font-size: 11.5px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .ci-line b { color: var(--ink); font-weight: 600; }
  .vrow + .meter, .ci-line + .vrow { margin-top: 8px; }
  .c-head ~ .meter { height: 6px; }
  .foot { display: flex; justify-content: space-between; margin-top: 14px; padding-top: 9px; border-top: 1px solid var(--grid); font-size: 11.5px; }
  .foot a { color: var(--c1); }
  .foot a:hover { text-decoration: underline; }
  .foot span { color: var(--ink-3); }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
</head>
<body>
<div id="app"><div class="problem">Loading…</div></div>
<div id="tip" role="tooltip"></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const host = params.get('in');               // menubar, embed (an iframe in another app), or none (a browser tab)
  document.documentElement.classList.add(host === 'menubar' ? 'menubar' : host ? 'embedded' : 'standalone');
  if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme');

  const clock = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit' });
  const hourFmt = new Intl.DateTimeFormat('en-US', { hour: 'numeric' });
  const app = document.getElementById('app');
  const tip = document.getElementById('tip');
  const NS = 'http://www.w3.org/2000/svg';
  let status = null;
  let problem = null;
  let names = [];                               // machine order, which fixes each machine's color

  // Colors follow the machine, never its rank: slot by position in the hub's list (8 slots, then they repeat).
  const color = (name) => `var(--c${(Math.max(0, names.indexOf(name)) % 8) + 1})`;
  const resultColor = { success: 'var(--good)', failure: 'var(--bad)' };

  const el = (tag, attrs = {}, ...kids) => {
    const node = tag.startsWith('svg:') ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else if (k === 'text') node.textContent = v;
      else node.setAttribute(k, v);
    }
    node.append(...kids.filter((k) => k != null));
    return node;
  };
  const dur = (s) => {
    s = Math.max(0, Math.round(s));
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.floor(s / 60)}m`;
    return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
  };
  const short = (repo) => (repo || '').split('/').pop();
  const median = (xs) => { const s = [...xs].sort((a, b) => a - b); return s.length ? s[Math.floor(s.length / 2)] : null; };
  const width = () => Math.max(260, app.clientWidth);
  const verdict = (r) => (r === 'success' ? '✓ passed' : r === 'failure' ? '✗ failed' : `– ${r}`);

  // Every job as an interval: finished ones from the last 6 hours, plus the ones running now.
  const intervals = (now) => {
    const done = status.history.filter((j) => j.started).map((j) => ({ ...j, s: j.started, e: j.finished }));
    const live = status.machines.flatMap((m) => m.jobs.filter((j) => (j.state || 'running') === 'running' && j.since)
      .map((j) => ({ ...j, machine: m.name, s: j.since, e: now, live: true })));
    return [...done, ...live];
  };
  const usualTimes = () => {
    const by = new Map();
    for (const j of status.history) {
      if (!j.started || j.result !== 'success') continue;
      const key = `${j.repo}\u0000${j.job}`;
      by.set(key, [...(by.get(key) || []), j.finished - j.started]);
    }
    return (j) => median(by.get(`${j.repo}\u0000${j.job}`) || []);
  };
  const tipFor = (j, now) => {
    const lines = [`${short(j.repo)} · ${j.job || 'waiting for a job'}`, [j.machine, j.label].filter(Boolean).join(' · ')];
    if (j.live) lines.push(`running ${dur(now - j.s)}, since ${clock.format(j.s * 1000)}`);
    else lines.push(`${verdict(j.result)}${j.s ? ` in ${dur(j.e - j.s)}` : ''}, at ${clock.format(j.e * 1000)}`);
    if (safe(j.url)) lines.push('Click to open on GitHub');
    return lines.join('\n');
  };
  // Links come from agents and sources; only web links are followed.
  const safe = (url) => (typeof url === 'string' && /^https?:\/\//i.test(url) ? url : null);
  const open = (url) => { if (safe(url)) window.open(safe(url), '_blank', 'noopener'); };
  const hoverable = (node, text) => {
    node.addEventListener('mousemove', (ev) => showTip(ev, typeof text === 'function' ? text() : text));
    node.addEventListener('mouseleave', hideTip);
    return node;
  };

  // ---- 6 hours as stacked columns: jobs running at once per machine, averaged over each 10 minutes
  function concurrency(now, all) {
    const W = width(), H = 84, top = 16, bottom = 16;
    const span = 6 * 3600, bucket = 600, t0 = now - span, n = span / bucket;
    const cols = [];
    for (let b = 0; b < n; b++) {
      const a = t0 + b * bucket, per = names.map(() => 0);
      for (let t = a; t < a + bucket; t += 60) {
        names.forEach((m, mi) => { per[mi] += all.filter((j) => j.machine === m && j.s <= t && j.e > t).length / 10; });
      }
      cols.push({ a, per });
    }
    const peak = Math.max(4, Math.ceil(Math.max(...cols.map((c) => c.per.reduce((x, y) => x + y, 0)))));
    const slot = W / n, colW = Math.max(3, Math.min(24, slot - 2));
    const y = (v) => top + (H - top - bottom) * (1 - v / peak);
    const svg = el('svg:svg', { width: '100%', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Jobs running at once over the last 6 hours, by machine' });
    svg.append(el('svg:line', { x1: 0, x2: W, y1: y(peak), y2: y(peak), stroke: 'var(--grid)', 'stroke-width': 1 }));
    svg.append(el('svg:text', { x: 0, y: y(peak) - 5, text: `${peak} at once` }));
    svg.append(el('svg:line', { x1: 0, x2: W, y1: y(0) + 0.5, y2: y(0) + 0.5, stroke: 'var(--grid)', 'stroke-width': 1 }));
    for (let t = Math.ceil(t0 / 3600) * 3600; t < now - 1500; t += 3600) {
      if (((t / 3600) % 2) !== 0) continue;
      svg.append(el('svg:text', { x: ((t - t0) / span) * W, y: H - 3, 'text-anchor': 'middle', text: hourFmt.format(t * 1000) }));
    }
    svg.append(el('svg:text', { x: W, y: H - 3, 'text-anchor': 'end', text: 'now' }));
    cols.forEach((c, i) => {
      const cx = i * slot + (slot - colW) / 2;
      let level = 0;
      const g = el('svg:g');
      names.forEach((m, mi) => {
        const v = c.per[mi];
        if (v < 0.05) return;
        const y1 = y(level + v), y2 = y(level) - (level ? 2 : 0);      // 2px surface gap between stacked parts
        level += v;
        if (y2 - y1 < 1) return;
        g.append(el('svg:rect', { x: cx, y: y1, width: colW, height: y2 - y1, rx: Math.min(2, (y2 - y1) / 2), fill: color(m) }));
      });
      const hit = hoverable(el('svg:rect', { x: i * slot, y: 0, width: slot, height: H - bottom, fill: 'transparent' }),
        `${clock.format(c.a * 1000)} – ${clock.format((c.a + bucket) * 1000)}, average at once\n` +
        names.map((m, mi) => `${m}  ${c.per[mi].toFixed(1)}`).join('\n'));
      svg.append(g, hit);
    });
    return svg;
  }

  // ---- per machine: one tile per reading (CPU, GPU, memory, heat), each with its 2-hour line, then the busiest programs
  const HOT_C = 90, WARM_C = 80, GPU_HOT_C = 85;
  const series = (m, key) => status.samples.filter((s) => s[m.name] && s[m.name][key] != null).map((s) => [s.t, s[m.name][key]]);

  // A small area chart with a hover crosshair. lo..hi fixes the scale; marks are dashed lines such as the heat limits.
  function spark(pts, { lo = 0, hi = 100, stroke, marks = [], fmt, title }) {
    const W = 100, H = 24;
    const svg = el('svg:svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none' });
    if (pts.length < 2) return svg;
    const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
    const x = (t) => ((t - t0) / Math.max(1, t1 - t0)) * W;
    const y = (v) => 1.5 + (H - 3) * (1 - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo));
    for (const mk of marks) {
      svg.append(el('svg:line', { x1: 0, x2: W, y1: y(mk.v), y2: y(mk.v), stroke: mk.color, 'stroke-width': 1,
        'stroke-dasharray': '3 2', 'vector-effect': 'non-scaling-stroke', opacity: 0.8 }));
    }
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(2)},${y(p[1]).toFixed(2)}`).join('');
    svg.append(el('svg:path', { d: `${d}L${W},${H}L0,${H}Z`, fill: stroke, 'fill-opacity': 0.13 }));
    svg.append(el('svg:path', { d, fill: 'none', stroke, 'stroke-width': 1.5, 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke' }));
    const cross = el('svg:line', { y1: 0, y2: H, stroke: 'var(--ink-3)', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke', opacity: 0 });
    svg.append(cross);
    const peak = Math.max(...pts.map((p) => p[1]));
    const avg = pts.reduce((a, p) => a + p[1], 0) / pts.length;
    svg.addEventListener('mousemove', (ev) => {
      const r = svg.getBoundingClientRect();
      const t = t0 + ((ev.clientX - r.left) / r.width) * (t1 - t0);
      const p = pts.reduce((best, q) => (Math.abs(q[0] - t) < Math.abs(best[0] - t) ? q : best));
      cross.setAttribute('x1', x(p[0])); cross.setAttribute('x2', x(p[0])); cross.setAttribute('opacity', 1);
      showTip(ev, `${title} at ${clock.format(p[0] * 1000)}: ${fmt(p[1])}\nlast ${dur(t1 - t0)}: peak ${fmt(peak)} · average ${fmt(avg)}`);
    });
    svg.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); hideTip(); });
    return svg;
  }

  function tile({ label, value, unit, sub, chart, flag, flagClass, hot, none }) {
    return el('div', { class: `tile${hot ? ' hot' : ''}${none ? ' none' : ''}` },
      el('div', { class: 'lab' }, el('span', { text: label }), flag ? el('span', { class: `flag ${flagClass || (hot ? '' : 'warm')}`, text: flag }) : null),
      el('div', { class: 'val' }, value, unit ? el('small', { text: unit }) : null),
      el('div', { class: 'sub', text: sub || ' ', title: sub || null }),
      chart || el('svg:svg', { viewBox: '0 0 100 24' }));
  }

  const pct = (v) => `${Math.round(v)}%`;
  const deg = (v) => `${Math.round(v)}°C`;
  const heatFlag = (c, hot) => (c == null ? null : c >= hot ? '▲ hot' : c >= WARM_C ? 'warm' : null);

  function tiles(m) {
    const c = color(m.name), out = [];
    if (m.cpu != null) {
      out.push(tile({ label: 'CPU', value: Math.round(m.cpu), unit: '%', flag: m.cores ? `${m.cores} cores` : null, flagClass: 'info',
        sub: m.load != null ? `load ${m.load}` : null,
        chart: spark(series(m, 'cpu'), { stroke: c, fmt: pct, title: `${m.name} CPU` }) }));
    }
    (m.gpus || []).forEach((g, i) => {
      const mem = g.memUsedGiB != null && g.memGiB ? `${g.memUsedGiB} / ${Math.round(g.memGiB)} GB` : g.name;
      out.push(tile({ label: (m.gpus.length > 1 ? `GPU ${i + 1}` : 'GPU'), value: g.busy != null ? Math.round(g.busy) : '–', unit: g.busy != null ? '%' : '',
        sub: mem, chart: i === 0 ? spark(series(m, 'gpu'), { stroke: c, fmt: pct, title: `${m.name} GPU` }) : null }));
    });
    if (m.memFreeGiB != null) {
      const total = m.memGiB, used = total ? Math.max(0, total - m.memFreeGiB) : null;
      out.push(used != null
        ? tile({ label: 'Memory', value: Math.round((100 * used) / total), unit: '%', sub: `${Math.round(used)} / ${Math.round(total)} GB`,
            chart: spark(series(m, 'mem'), { stroke: c, fmt: pct, title: `${m.name} memory used` }) })
        : tile({ label: 'Memory', value: Math.round(m.memFreeGiB), unit: ' GB', sub: 'free' }));
    }
    if (m.cpu != null || (m.gpus || []).length) {
      const gpuTemps = (m.gpus || []).map((g) => g.temp).filter((t) => t != null);
      const gpuHot = gpuTemps.some((t) => t >= GPU_HOT_C);
      if (m.cpuTemp != null) {
        const hot = m.cpuTemp >= HOT_C || gpuHot;
        out.push(tile({ label: 'Heat', value: Math.round(m.cpuTemp), unit: '°C', hot,
          flag: gpuHot ? '▲ GPU hot' : heatFlag(m.cpuTemp, HOT_C),
          sub: gpuTemps.length ? `CPU · GPU ${gpuTemps.map(deg).join(' ')}` : 'CPU',
          chart: spark(series(m, 'temp'), { lo: 30, hi: 100, stroke: hot ? 'var(--bad)' : c, fmt: deg, title: `${m.name} CPU heat`,
            marks: [{ v: HOT_C, color: 'var(--bad)' }] }) }));
      } else if (gpuTemps.length) {
        out.push(tile({ label: 'Heat', value: Math.round(Math.max(...gpuTemps)), unit: '°C', hot: gpuHot,
          flag: heatFlag(Math.max(...gpuTemps), GPU_HOT_C), sub: 'GPU' }));
      } else {
        out.push(tile({ label: 'Heat', value: '–', sub: 'no sensor', none: true }));
      }
    }
    return out.length ? el('div', { class: 'tiles4', style: { gridTemplateColumns: `repeat(${out.length}, minmax(0, 1fr))` } }, ...out) : null;
  }

  // The busiest programs as bars against one full core (a program on several cores runs past 100%).
  function busiest(m) {
    const list = m.busiest || [];
    if (!list.length) return null;
    const scale = Math.max(100, ...list.map((p) => p.cpu));
    const grid = el('div', { class: 'procs' }, el('div', { class: 'pl', text: 'busiest programs · % of one core' }));
    for (const p of list) {
      grid.append(el('div', { class: 'pn', text: p.name, title: `${p.name} (pid ${p.pid})` }),
        meter(p.cpu / scale, color(m.name), `${p.cpu}% of one core`), el('div', { class: 'pv', text: `${p.cpu}%` }));
    }
    return grid;
  }

  function meter(share, fill, title) {
    return el('div', { class: 'meter', title }, el('i', { style: { width: `${Math.max(0, Math.min(1, share)) * 100}%`, background: fill } }));
  }

  function machineRows() {
    const wrap = el('div');
    for (const m of status.machines) {
      const card = el('div', { class: 'mcard' });
      const head = el('div', { class: 'mhead' }, el('div', { class: 'mname' }, el('span', { class: 'dot', style: { background: color(m.name) } }), m.name));
      card.append(head);
      if (!m.ok) {
        card.append(el('div', { class: 'mmeta err', text: m.error || 'no answer' }));
        wrap.append(card);
        continue;
      }
      const running = m.jobs.filter((j) => (j.state || 'running') === 'running').length;
      if (!m.virtual) head.append(el('span', { class: 'chip', text: `${running} running${m.draining ? ' · draining' : ''}` }));
      if (m.hot) head.append(el('span', { class: 'chip hot', text: `▲ hot: ${m.hot}` }));
      const lines = [];
      if (m.slots && m.slots.total) {
        const blocks = el('div', { class: 'slots', title: `${m.slots.used} of ${m.slots.total} ${m.slots.label || 'slots'} in use`,
          style: { width: `${Math.min(110, m.slots.total * 8)}px` } });
        for (let i = 0; i < m.slots.total; i++) blocks.append(el('i', { style: i < m.slots.used ? { background: color(m.name) } : null }));
        head.append(el('span', { class: 'chip', style: { marginLeft: 'auto' }, text: `${m.slots.used}/${m.slots.total} ${m.slots.label || 'slots'}` }), blocks);
      }
      const others = m.jobs.filter((j) => !j.size).length;     // jobs not holding a slot: runner services
      if (m.slots && others) lines.push(`${others} on runner services`);
      if (m.meter && m.meter.max) {
        const share = m.meter.value / m.meter.max;
        card.append(el('div', { class: 'vrow' }, meter(share, share < 0.15 ? 'var(--bad)' : share < 0.3 ? 'var(--warn)' : color(m.name), m.meter.label),
          el('span', { class: 'chip', text: `${m.meter.value} of ${m.meter.max} ${m.meter.label || ''}`.trim() })));
      } else if (m.load != null && m.cores && m.cpu == null) {
        card.append(el('div', { class: 'vrow' }, meter(m.load / m.cores, color(m.name), 'load against cores'),
          el('span', { class: 'chip', text: `load ${m.load} on ${m.cores} cores` })));
      }
      const t = tiles(m);
      if (t) card.append(t);
      const b = busiest(m);
      if (b) card.append(b);
      if (m.note) lines.push(m.note);
      if (lines.length) card.append(el('div', { class: 'mmeta', text: lines.join(' · ') }));
      for (const w of m.warnings || []) card.append(el('div', { class: 'mmeta warn', text: `⚠ ${w}` }));
      wrap.append(card);
    }
    return wrap;
  }

  // ---- running now, each with how far along it is against that job's usual time
  function runningList(now) {
    const usual = usualTimes();
    const wrap = el('div');
    const jobs = status.machines.flatMap((m) => m.jobs.map((j) => ({ ...j, machine: m.name })))
      .sort((a, b) => (a.since || 0) - (b.since || 0));
    if (!jobs.length) wrap.append(el('div', { class: 'empty', text: 'Nothing running. Every machine is idle.' }));
    for (const j of jobs) {
      const starting = j.state === 'starting';
      const elapsed = now - (j.since || now);
      const norm = starting ? null : usual(j);
      const row = el(safe(j.url) ? 'a' : 'div', { class: 'run', href: safe(j.url), target: '_blank', rel: 'noopener' },
        el('span', { class: 'dot', style: { background: color(j.machine), opacity: starting ? 0.4 : 1 } }),
        el('div', { class: 'what' }, el('b', { text: short(j.repo) }), el('span', { text: `  ${j.job || 'starting…'}` })),
        el('div', { class: 'when', text: starting ? 'starting' : norm ? `${dur(elapsed)} of ~${dur(norm)}` : dur(elapsed) }));
      if (!starting) {
        const share = norm ? Math.min(1, elapsed / norm) : null;
        const over = norm && elapsed > norm * 1.5;
        row.append(el('div', { class: 'bar' }, el('i', { style: {
          width: share == null ? '100%' : `${Math.max(3, share * 100)}%`,
          background: over ? 'var(--warn)' : color(j.machine), opacity: share == null ? 0.22 : 1 } })));
      }
      hoverable(row, [j.repo, [j.machine, j.label].filter(Boolean).join(' · '),
        starting ? 'machine starting; waiting for GitHub to hand it the job'
          : `running ${dur(elapsed)}${norm ? `; usually ${dur(norm)}${elapsed > norm * 1.5 ? ' (running long)' : ''}` : ''}`].join('\n'));
      wrap.append(row);
    }
    return wrap;
  }

  // ---- the last hour as swimlanes: one band per machine, jobs packed into lanes
  function timeline(now, all) {
    const W = width(), span = 3600, t0 = now - span, label = 84, bandGap = 12, axis = 16, maxLanes = 10;
    const plotW = W - label - 4;
    const x = (t) => label + ((Math.max(t, t0) - t0) / span) * plotW;
    const bands = names.map((m) => {
      const jobs = all.filter((j) => j.machine === m && j.e > t0).sort((a, b) => a.s - b.s);
      const ends = [];
      for (const j of jobs) {
        let lane = ends.findIndex((e) => e <= j.s - 20);
        if (lane < 0) lane = ends.length < maxLanes ? ends.push(0) - 1 : ends.indexOf(Math.min(...ends));
        ends[lane] = Math.max(ends[lane], j.e);
        j.lane = lane;
      }
      const lanes = Math.max(1, ends.length);
      const laneH = lanes > 6 ? 5 : 7, gap = lanes > 6 ? 2 : 3;
      return { m, jobs, lanes, laneH, gap, h: lanes * (laneH + gap) - gap };
    });
    const H = bands.reduce((h, b) => h + b.h + bandGap, 0) - bandGap + axis + 4;
    const svg = el('svg:svg', { width: '100%', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Jobs in the last hour, by machine' });
    for (let k = 0; k <= 4; k++) {
      const gx = x(t0 + (span * k) / 4);
      svg.append(el('svg:line', { x1: gx, x2: gx, y1: 0, y2: H - axis, stroke: 'var(--grid)', 'stroke-width': 1 }));
      svg.append(el('svg:text', { x: gx, y: H - 3, 'text-anchor': k === 0 ? 'start' : k === 4 ? 'end' : 'middle', text: k === 4 ? 'now' : `${60 - k * 15}m ago` }));
    }
    let y0 = 0;
    for (const band of bands) {
      const mid = y0 + Math.min(band.h, 8) / 2;
      svg.append(el('svg:circle', { cx: 4, cy: mid, r: 4, fill: color(band.m) }));
      svg.append(el('svg:text', { x: 13, y: mid + 3.5, style: 'fill: var(--ink-2); font-weight: 600', text: band.m.length > 11 ? `${band.m.slice(0, 10)}…` : band.m }));
      if (!band.jobs.length) svg.append(el('svg:line', { x1: label, x2: label + plotW, y1: mid, y2: mid, stroke: 'var(--track)', 'stroke-width': 2, 'stroke-linecap': 'round' }));
      for (const j of band.jobs) {
        const bx = x(j.s), bw = Math.max(3, x(j.e) - bx), by = y0 + j.lane * (band.laneH + band.gap);
        const failed = j.result === 'failure';
        const fill = failed ? 'var(--bad)' : j.live || j.result === 'success' ? color(band.m) : 'var(--gone)';
        const bar = el('svg:rect', { x: bx, y: by, width: bw, height: band.laneH, rx: Math.min(3, band.laneH / 2), fill,
          'fill-opacity': j.live || failed ? 1 : 0.4, style: safe(j.url) ? 'cursor:pointer' : null });
        hoverable(bar, () => tipFor(j, Date.now() / 1000));
        bar.addEventListener('click', () => open(j.url));
        svg.append(bar);
        if (j.live) svg.append(el('svg:circle', { class: 'live', cx: bx + bw - 1, cy: by + band.laneH / 2, r: band.laneH * 0.65, fill: color(band.m), 'pointer-events': 'none' }));
      }
      y0 += band.h + bandGap;
    }
    return svg;
  }

  // ---- the last 6 hours: one tile per finished job, oldest first
  function results() {
    const done = status.history;
    if (!done.length) return el('div', { class: 'empty', text: 'No jobs finished in the last 6 hours.' });
    const passed = done.filter((j) => j.result === 'success').length;
    const failed = done.filter((j) => j.result === 'failure').length;
    const other = done.length - passed - failed;
    const times = done.filter((j) => j.started).map((j) => j.finished - j.started);
    const tally = el('div', { class: 'tally' },
      el('span', {}, el('span', { class: 'ok-i', text: '✓ ' }), el('b', { text: passed }), ' passed'),
      el('span', {}, el('span', { class: 'bad-i', text: '✗ ' }), el('b', { text: failed }), ' failed'));
    if (other) tally.append(el('span', {}, '– ', el('b', { text: other }), ' cancelled'));
    if (times.length) tally.append(el('span', { style: { marginLeft: 'auto' } }, 'median ', el('b', { text: dur(median(times)) })));
    const tiles = el('div', { class: 'tiles', role: 'list', 'aria-label': 'Finished jobs, oldest first' });
    for (const j of done) {
      const tile = el(safe(j.url) ? 'a' : 'span', { href: safe(j.url), target: '_blank', rel: 'noopener', role: 'listitem',
        style: { background: resultColor[j.result] || 'var(--gone)', opacity: j.result === 'success' ? 0.55 : 1 },
        'aria-label': `${short(j.repo)} ${j.job} ${j.result}` });
      tiles.append(hoverable(tile, () => tipFor({ ...j, s: j.started, e: j.finished }, 0)));
    }
    return el('div', {}, tally, tiles);
  }

  function showTip(ev, text) {
    const [first, ...rest] = text.split('\n');
    tip.replaceChildren(el('b', { text: first }), rest.length ? `\n${rest.join('\n')}` : '');
    tip.style.opacity = 1;
    const r = tip.getBoundingClientRect();
    let left = ev.clientX + 12, top = ev.clientY + 14;
    if (left + r.width > innerWidth - 6) left = ev.clientX - r.width - 12;
    if (top + r.height > innerHeight - 6) top = ev.clientY - r.height - 10;
    tip.style.left = `${Math.max(6, left)}px`;
    tip.style.top = `${Math.max(6, top)}px`;
  }
  function hideTip() { tip.style.opacity = 0; }

  function freshness() {
    const node = document.querySelector('.fresh');
    if (!node || !status) return;
    const age = Date.now() / 1000 - status.updated;
    node.classList.toggle('stale', age > 30 || !!problem);
    node.textContent = problem ? `${problem} · showing data from ${clock.format(status.updated * 1000)}`
      : age < 10 ? 'updated just now' : `updated ${dur(age)} ago`;
  }

  // The menu bar app sizes its panel to the page; T3's card does the same.
  function reportHeight() {
    // The page's own content, not the document: in the panel the body fills the window, so the document is never
    // shorter than the panel and the panel could only grow.
    const height = Math.ceil(app.offsetTop + app.offsetHeight + parseFloat(getComputedStyle(document.body).paddingBottom));
    window.webkit?.messageHandlers?.lanes?.postMessage({ height });
    if (host === 'embed') parent.postMessage({ type: 'lanes-height', height }, '*');
  }

  // Fans roaring with no CI running: say which machine is hot and what is busy there, at the top.
  function heatBanner() {
    const hot = status.machines.filter((m) => m.hot);
    if (!hot.length) return null;
    return el('div', { class: 'heat' }, ...hot.map((m) => {
      const top = (m.busiest || [])[0];
      return el('div', {}, el('b', { text: `▲ ${m.name} is running hot: ${m.hot}` }), top ? ` · busiest: ${top.name} ${top.cpu}%` : '');
    }));
  }

  // ---- compact layout (menu bar panel, T3 card): what each machine is doing at a glance, details on click, CI in
  // brief, and the full charts one click away in the browser.
  const opened = new Set((() => { try { return JSON.parse(localStorage.getItem('lanes-open') || '[]'); } catch { return []; } })());
  const saveOpened = () => { try { localStorage.setItem('lanes-open', JSON.stringify([...opened])); } catch {} };
  const real = () => status.machines.filter((m) => !m.virtual);
  const heatOf = (m) => {
    const temps = [m.cpuTemp, ...(m.gpus || []).map((g) => g.temp)].filter((t) => t != null);
    return temps.length ? Math.max(...temps) : null;
  };

  function compactHead() {
    const hot = real().filter((m) => m.hot);
    const down = real().filter((m) => !m.ok);
    const warm = real().filter((m) => m.ok && !m.hot && heatOf(m) >= WARM_C);
    let title, bad = false;
    if (hot.length) { title = hot.map((m) => `▲ ${m.name} is running hot: ${m.hot}`).join('\n'); bad = true; }
    else if (down.length) { title = `▲ ${down.map((m) => m.name).join(', ')} not answering`; bad = true; }
    else if (warm.length) title = `${warm.map((m) => `${m.name} is warm (${Math.round(heatOf(m))}°C)`).join(', ')}; the rest normal`;
    else title = `All ${real().length} machines normal`;
    const jobs = status.running;
    const sub = `${jobs} CI job${jobs === 1 ? '' : 's'} running${status.starting ? ` · ${status.starting} starting` : ''}`;
    return el('div', { class: 'c-head' },
      el('div', {}, el('div', { class: `c-title${bad ? ' bad' : ''}`, style: { whiteSpace: 'pre-line' }, text: title }), el('div', { class: 'c-sub', text: sub })),
      el('div', { class: 'fresh' }));
  }

  function cell(text, share, fill, cls) {
    if (text == null) return el('div', { class: 'cell na', text: '–' });
    return el('div', { class: `cell${cls ? ` ${cls}` : ''}` }, text,
      el('i', {}, el('b', { style: { width: `${Math.max(2, Math.min(1, share) * 100)}%`, background: fill } })));
  }

  // Why the machine is busy, in a few words: its busiest program, else its CI jobs, else idle.
  function why(m) {
    const top = (m.busiest || [])[0];
    const running = m.jobs.filter((j) => (j.state || 'running') === 'running').length;
    const parts = [];
    if (top) parts.push(`${top.name} ${top.cpu}%`);
    if (running) parts.push(`${running} CI job${running === 1 ? '' : 's'}`);
    return parts.join(' · ') || 'idle';
  }

  function details(m) {
    const c = color(m.name);
    const chart = (label, key, now, fmt, opts = {}) => {
      const pts = series(m, key);
      if (now == null && pts.length < 2) return null;
      const peak = pts.length ? Math.max(...pts.map((p) => p[1])) : null;
      return el('div', {}, el('div', { class: 'lab' }, el('span', {}, el('b', { text: label }), now != null ? `  ${fmt(now)}` : ''),
        el('span', { text: peak != null ? `peak ${fmt(peak)}` : '' })),
        spark(pts, { stroke: c, fmt, title: `${m.name} ${label}`, ...opts }));
    };
    const free = m.memFreeGiB, total = m.memGiB;
    const memNow = free != null && total ? (100 * (total - free)) / total : null;
    const gpu = (m.gpus || [])[0];
    const multi = el('div', { class: 'multi' }, ...[
      chart('CPU', 'cpu', m.cpu, pct),
      gpu ? chart('GPU', 'gpu', gpu.busy, pct) : null,
      chart('Memory', 'mem', memNow, pct),
      chart('Heat', 'temp', m.cpuTemp, deg, { lo: 30, hi: 100, marks: [{ v: HOT_C, color: 'var(--bad)' }],
        stroke: m.cpuTemp >= HOT_C ? 'var(--bad)' : c }),
    ].filter(Boolean));
    const facts = [];
    if (m.cores) facts.push(`${m.cores} cores, load ${m.load}`);
    if (total) facts.push(`memory ${Math.round(total - free)} of ${Math.round(total)} GB`);
    for (const g of m.gpus || []) facts.push(`${g.name}${g.memUsedGiB != null && g.memGiB ? `, ${g.memUsedGiB} of ${Math.round(g.memGiB)} GB` : ''}${g.temp != null ? `, ${deg(g.temp)}` : ''}`);
    if (m.slots && m.slots.total) facts.push(`CI: ${m.slots.used} of ${m.slots.total} ${m.slots.label || 'slots'} in use`);
    if (m.cpuTemp == null && !(m.gpus || []).some((g) => g.temp != null)) facts.push('no heat sensor');
    if (m.note) facts.push(m.note);
    const more = el('div', { class: 'mt-more' }, el('div', { class: 'kv', text: facts.join(' · ') }), multi);
    const b = busiest(m);
    if (b) more.append(b);
    for (const w of m.warnings || []) more.append(el('div', { class: 'mmeta warn', text: `⚠ ${w}` }));
    return more;
  }

  function machineTable() {
    const wrap = el('div', {}, el('div', { class: 'mt-cols' }, el('span'), ...['CPU', 'GPU', 'Memory', 'Heat'].map((t) => el('span', { text: t })), el('span')));
    for (const m of real()) {
      const block = el('div', { class: `mt${opened.has(m.name) ? ' open' : ''}` });
      const name = el('div', { class: 'mt-name' }, el('div', { class: 'mname' }, el('span', { class: 'dot', style: { background: color(m.name) } }), m.name));
      let cells;
      if (!m.ok) {
        name.append(el('div', { class: 'mt-why', style: { color: 'var(--bad)' }, text: m.error || 'no answer' }));
        cells = [cell(null), cell(null), cell(null), cell(null)];
      } else {
        name.append(el('div', { class: 'mt-why', text: why(m) }));
        const gpu = (m.gpus || []).map((g) => g.busy).filter((v) => v != null);
        const memShare = m.memFreeGiB != null && m.memGiB ? 1 - m.memFreeGiB / m.memGiB : null;
        const heat = heatOf(m);
        const hotNow = !!m.hot;
        cells = [
          cell(m.cpu != null ? pct(m.cpu) : null, (m.cpu || 0) / 100, color(m.name)),
          cell(gpu.length ? pct(Math.max(...gpu)) : null, Math.max(0, ...gpu) / 100, color(m.name)),
          cell(memShare != null ? pct(memShare * 100) : m.memFreeGiB != null ? `${Math.round(m.memFreeGiB)} GB` : null, memShare ?? 0, color(m.name)),
          cell(heat != null ? `${hotNow ? '▲ ' : ''}${Math.round(heat)}°` : null, (heat - 30) / 70,
            hotNow ? 'var(--bad)' : heat >= WARM_C ? 'var(--warn)' : 'var(--ink-3)', hotNow ? 'bad' : null),
        ];
      }
      const row = el('div', { class: 'mt-row', role: 'button', tabindex: 0, 'aria-expanded': String(opened.has(m.name)) },
        name, ...cells, el('div', { class: 'chev', text: '▶' }));
      const toggle = () => { opened.has(m.name) ? opened.delete(m.name) : opened.add(m.name); saveOpened(); render(); };
      row.addEventListener('click', toggle);
      row.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } });
      block.append(row);
      if (m.ok && opened.has(m.name)) block.append(details(m));
      wrap.append(block);
    }
    return wrap;
  }

  function ciBrief(now) {
    const done = status.history;
    const passed = done.filter((j) => j.result === 'success').length, failed = done.filter((j) => j.result === 'failure').length;
    const times = done.filter((j) => j.started).map((j) => j.finished - j.started);
    const line = el('div', { class: 'ci-line' });
    if (done.length) {
      line.append(el('span', {}, el('span', { class: 'ok-i', text: '✓ ' }), el('b', { text: passed }), ' passed'),
        el('span', {}, el('span', { class: 'bad-i', text: '✗ ' }), el('b', { text: failed }), ' failed'));
      if (times.length) line.append(el('span', {}, 'median ', el('b', { text: dur(median(times)) })));
    } else {
      line.append(el('span', { text: 'No jobs finished in the last 6 hours.' }));
    }
    const out = [line];
    if (status.machines.some((m) => m.jobs.length)) out.push(el('div', { style: { marginTop: '6px' } }, runningList(now)));
    for (const m of status.machines.filter((v) => v.virtual && v.meter && v.meter.max)) {
      const share = m.meter.value / m.meter.max;
      out.push(el('div', { class: 'vrow' }, el('div', { class: 'mname' }, el('span', { class: 'dot', style: { background: color(m.name) } }), m.name),
        el('span', { class: 'chip', text: `${m.meter.value} of ${m.meter.max} ${m.meter.label || ''}`.trim() })),
        meter(share, share < 0.15 ? 'var(--bad)' : share < 0.3 ? 'var(--warn)' : color(m.name), m.meter.label));
    }
    return out;
  }

  function renderCompact(now) {
    app.replaceChildren(
      compactHead(),
      el('div', { class: 'c-label' }, el('span', { text: 'Machines' }), el('span', { text: 'click a machine for its last 2 hours' })),
      machineTable(),
      el('div', { class: 'c-label' }, el('span', { text: 'CI' }), el('span', { text: 'last 6 hours' })),
      ...ciBrief(now),
      el('div', { class: 'foot' }, el('a', { href: `${location.origin}/`, target: '_blank', rel: 'noopener', text: 'Open full view ↗' }),
        el('span', { text: 'Esc to close' })),
    );
  }

  function render() {
    hideTip();
    if (!status) {
      app.replaceChildren(problem
        ? el('div', { class: 'problem' }, el('b', { text: "Can't reach the Lanes hub" }),
            `Nothing answers at ${location.host}. Is \`lanes hub\` running, and the tunnel to it up?`)
        : el('div', { class: 'problem', text: 'Loading…' }));
      reportHeight();
      return;
    }
    names = status.machines.map((m) => m.name);
    const now = Date.now() / 1000;
    if (host) {
      renderCompact(now);
      freshness();
      reportHeight();
      return;
    }
    const all = intervals(now);
    const legend = el('div', { class: 'legend' }, ...names.map((m) => el('span', { class: 'key' }, el('span', { class: 'dot', style: { background: color(m) } }), m)));
    const label = el('div', { class: 'hero-label' }, `job${status.running === 1 ? '' : 's'} running`);
    if (status.starting) label.append(el('div', {}, el('b', { text: status.starting }), ' starting'));
    app.replaceChildren(
      el('div', { class: 'head' }, el('div', { class: 'hero', text: status.running }), label, legend),
      el('div', { class: 'fresh' }),
      ...[heatBanner()].filter(Boolean),
      el('section', {}, el('h2', {}, 'Jobs at once', el('span', { class: 'aside', text: 'last 6 hours' })), concurrency(now, all)),
      el('section', {}, el('h2', {}, 'Machines', el('span', { class: 'aside', text: 'whole machine, CI or not · lines: last 2 hours' })), machineRows()),
      el('section', {}, el('h2', {}, 'Running now'), runningList(now)),
      el('section', {}, el('h2', {}, 'Last hour', el('span', { class: 'aside', text: 'bright: running · faded: passed · red: failed' })), timeline(now, all)),
      el('section', {}, el('h2', {}, 'Finished', el('span', { class: 'aside', text: 'last 6 hours, oldest first' })), results()),
    );
    freshness();
    reportHeight();
  }

  async function refresh() {
    try {
      const response = await fetch('status.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(response.status);
      status = await response.json();
      problem = null;
    } catch {
      problem = "Can't reach the Lanes hub";
    }
    render();
  }

  // Esc or Ctrl+Shift+C asks the host (menu bar panel or T3 card) to close.
  addEventListener('keydown', (ev) => {
    const toggle = ev.ctrlKey && ev.shiftKey && !ev.metaKey && !ev.altKey && ev.code === 'KeyC';
    if (ev.key !== 'Escape' && !toggle) return;
    ev.preventDefault();
    if (host === 'embed') parent.postMessage({ type: 'lanes-close' }, '*');
    window.webkit?.messageHandlers?.lanes?.postMessage({ close: true });
  });
  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 80); });
  refresh();
  setInterval(refresh, 5000);
  setInterval(freshness, 1000);
})();
</script>
</body>
</html>
