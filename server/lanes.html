  }

  function ciBar(ci) {
    const bar = el('span', { class: 'cibar', role: 'img',
      'aria-label': `${ci.passed} of ${ci.total} checks passed, ${ci.failed} failed, ${ci.running} running, ${ci.pending} not started` });
    for (const [cls, n] of [['', ci.passed], ['fail', ci.failed], ['run', ci.running], ['todo', ci.pending]]) {
      if (n) bar.append(el('i', { class: cls || null, style: { flexGrow: n } }));
    }
    return bar;
  }
  // The status at the top of the entry already says running or waiting, so this line only counts.
  const ciText = (ci) => (ci.failed ? `${ci.failed} of ${plural(ci.total, 'check')} failed`
    : ci.pending && ci.pending === ci.total ? `${plural(ci.total, 'check')} waiting`
    : `${ci.passed}/${plural(ci.total, 'check')} passed`);

  function checksBody(p) {
    const ci = p.ci || {}, checks = ci.checks || [];
    const list = el('ul', { class: 'clist' });
    for (const c of checks) {
      const state = CHECK_WORD[c.state] ? c.state : 'pending';
      list.append(el('li', {}, el('i', { class: `sdot ${state}` }),
        el(safe(c.url) ? 'a' : 'span', { href: safe(c.url), target: '_blank', rel: 'noopener noreferrer', text: c.name,
          title: safe(c.url) ? `${c.name}: open its log on GitHub` : c.name }),
        el('em', { text: CHECK_WORD[state] })));
    }
    if (ci.total > checks.length) list.append(el('li', {}, el('i'), el('span', { class: 'rest', text: `and ${ci.total - checks.length} more on GitHub` }), el('em')));
    return [checks.length ? list : null, mergeLine(p)];
  }

  function filesBody(p, count) {
    const files = p.files || [];
    return [el('ul', { class: 'flist' },
      ...files.map((f) => el('li', {}, el('span', { class: 'path', text: f.path }), el('span', { class: 'add', text: `+${f.additions}` }), el('span', { class: 'del', text: `−${f.deletions}` }))),
      count > files.length ? el('li', {}, el('span', { class: 'rest', text: `and ${plural(count - files.length, 'more file')} on GitHub` })) : null)];
  }

  const endStop = (text) => (/[.!?…:]$/.test(text) ? text : `${text}.`);

  function buildCard(p, sig, old) {
    const url = safe(p.url);
    const media = (p.media || []).filter((m) => m && mediaSrc(m.src));
    const mediaSig = JSON.stringify(media);
    const proof = old && old.mediaSig === mediaSig ? old.proof : proofStage(media);
    const [word, tone] = prStatus(p);
    const ci = p.ci || {}, count = p.changed_files || (p.files || []).length;
    const summary = (p.summary || '').trim(), reason = p.why && p.why !== p.summary && p.why.length <= 160 ? p.why.trim() : '';
    const diff = [el('span', { class: 'add', text: `+${p.additions || 0}` }), el('span', { class: 'del', text: `−${p.deletions || 0}` }), el('span', { text: plural(count, 'file') })];
    const [filesBtn, filesPanel] = (p.files || []).length ? disclose(p, 'files', diff, filesBody(p, count)) : [el('span', { class: 'disc' }, ...diff), null];
    const [checksBtn, checksPanel] = ci.total ? disclose(p, 'checks', [ciBar(ci), el('span', { text: ciText(ci) })], checksBody(p)) : [el('span', { class: 'disc', text: 'No checks yet' }), null];
    const node = el('article', { class: 'pr', 'aria-label': `${p.repo} #${p.number}` },
      el('div', { class: 'pr-meta' },
        el('span', { class: `st ${tone}` }, el('i'), word),
        el('span', { text: `#${p.number}` }),
        el('span', { class: 'pr-repo', text: short(p.repo), title: p.repo }),
        p.is_bot || manyAuthors ? el('span', { text: p.is_bot ? `${(p.author || 'bot').replace(/\[bot\]$/, '')} (bot)` : p.author || 'unknown' }) : null,
        p.is_release ? el('span', { text: 'release' }) : null,
        p.updated_at ? el('time', { 'data-ts': p.updated_at, title: `Updated ${new Date(p.updated_at * 1000).toLocaleString()}` }) : null),
      el(url ? 'a' : 'span', { class: 'pr-title', href: url, target: '_blank', rel: 'noopener noreferrer', text: p.title || 'Untitled pull request',
        title: p.head_ref ? `${p.head_ref} into ${p.base_ref || 'the base branch'}` : null }),
      proof,
      summary || reason ? el('p', { class: `pr-text${summary && reason ? ' three' : ''}` }, summary && reason ? `${endStop(summary)} ` : summary || null,
        reason ? el('span', { text: reason }) : null) : null,
      el('div', { class: 'pr-foot' }, filesBtn, checksBtn,
        url ? el('a', { class: 'pr-open', href: url, target: '_blank', rel: 'noopener noreferrer' }, el('span', { text: 'Open on GitHub' }), icon('ext')) : null),
      filesPanel, checksPanel);
    return { sig, pr: p, node, hay: haystack(p), proof, mediaSig };
  }

  const haystack = (p) => [p.title, p.repo, `#${p.number}`, p.head_ref, p.author, p.summary, p.why, ...(p.files || []).map((f) => f.path)]
    .filter(Boolean).join('\n').toLowerCase();

  function prSetupCard() {
    return el('div', { class: 'card emptycard' },
      el('h2', { text: 'Pull requests are not connected yet' }),
      el('p', {}, 'Add a ', code('[pull_requests]'), ' section to ', code('hub.toml'), ' on the hub, list the GitHub users or organizations to watch, then restart ', code('lanes hub'), '.'),
      el('pre', { text: '[pull_requests]\nowners = ["your-user", "your-org"]\n# refresh_s = 45\n# token_command = "gh auth token"' }),
      el('p', { text: 'The hub reads your GitHub token itself, so the token never reaches this page. Open pull requests then show up here with their proof videos, screenshots and checks.' }));
  }

  function applyPrs(data) {
    prs = data;
    prsSig = JSON.stringify([data.configured, data.error, data.prs]);
    pendingPrs = null;
    ui.pending.hidden = true;
    const list = data.prs || [];
    manyAuthors = new Set(list.filter((p) => !p.is_bot).map((p) => p.author)).size > 1;
    const next = new Map();
    for (const p of list) {
      const sig = JSON.stringify([p, manyAuthors]), old = cards.get(p.id);
      next.set(p.id, old && old.sig === sig ? old : buildCard(p, sig, old));
    }
    for (const id of [...opens.keys()]) if (!next.has(id)) opens.delete(id);
    cards = next;
    layoutPrs();
    render();
  }

  function layoutPrs() {
    if (!prs) return;
    const has = prs.configured && cards.size > 0;
    ui.prHead.hidden = ui.prGrid.hidden = !has;
    ui.prBlank.hidden = has;
    ui.prNote.hidden = !(prs.configured && prs.error);
    ui.prNote.textContent = prs.error ? `GitHub: ${prs.error}` : '';
    if (!has) {
      scopeCount = prs.configured ? 0 : null;
      ui.prBlank.replaceChildren(prs.configured
        ? el('div', { class: 'card emptycard' }, el('h2', { text: 'No open pull requests' }),
            el('p', { text: (prs.owners || []).length ? `Nothing is open across ${prs.owners.join(', ')} right now.` : 'Nothing is open right now.' }))
        : prSetupCard());
      return;
    }
    const all = [...cards.values()];
    const bots = all.filter((r) => r.pr.is_bot).length;
    const scope = all.filter((r) => !(pv.hideBots && r.pr.is_bot));
    if (pv.repo && !scope.some((r) => r.pr.repo === pv.repo)) pv.repo = null;
    const inRepo = scope.filter((r) => !pv.repo || r.pr.repo === pv.repo);
    const inView = inRepo.filter((r) => VIEWS.find(([key]) => key === pv.view)[2](r.pr));
    const terms = pv.q.toLowerCase().split(/\s+/).filter(Boolean);
    const shown = inView.filter((r) => terms.every((t) => r.hay.includes(t)));
    scopeCount = scope.length;

    const perRepo = new Map(), shorts = new Map();
    for (const r of scope) perRepo.set(r.pr.repo, [...(perRepo.get(r.pr.repo) || []), r]);
    for (const repo of perRepo.keys()) shorts.set(short(repo), (shorts.get(short(repo)) || 0) + 1);
    const repoLabel = (repo) => (shorts.get(short(repo)) > 1 ? repo : short(repo));
    const byRank = (a, b) => perRepo.get(b[0]).length - perRepo.get(a[0]).length || a[0].localeCompare(b[0]);
    const repos = [...perRepo].sort(byRank);

    // The rail: every repository with its count, a red dot where something is failing, a play mark where there is proof.
    const repoRow = (repo, label, recs) => {
      const bad = recs.filter((r) => failing(r.pr)).length, proof = recs.filter((r) => r.pr.has_proof).length;
      const b = el('button', { class: 'repo', type: 'button', 'aria-pressed': String(pv.repo === repo), 'data-k': `repo:${repo || ''}`,
        title: repo ? [repo, proof ? `${proof} with proof` : null, bad ? `${bad} failing` : null].filter(Boolean).join(' · ') : null },
        el('span', { class: 'nm', text: label }),
        el('i', { class: `mk ${!repo || !proof ? 'off' : recs.some((r) => r.pr.has_video) ? 'vid' : 'pic'}` }),
        el('i', { class: `mk${repo && bad ? '' : ' off'}` }),
        el('span', { class: 'ct', text: recs.length }));
      b.addEventListener('click', () => { pv.repo = repo; layoutPrs(); });
      return el('li', {}, b);
    };

    // A sheet is one surface of entries. Past `limit` the rest wait behind one quiet button.
    const sheet = (recs, key, limit) => {
      const cut = recs.length > limit + 1 && !pv.more.has(key) ? limit : recs.length;
      const box = el('div', { class: 'sheet' }, ...recs.slice(0, cut).map((r) => r.node));
      if (cut < recs.length) {
        const more = el('button', { class: 'more', type: 'button', 'data-k': `more:${key}`, text: `Show ${recs.length - cut} more` });
        more.addEventListener('click', () => { pv.more.add(key); layoutPrs(); });
        box.append(more);
      }
      return box;
    };
    const proofFirst = (recs) => [...recs.filter((r) => r.pr.has_proof), ...recs.filter((r) => !r.pr.has_proof)];
    const feed = () => {
      if (!shown.length) {
        const [title, text] = !scope.length ? ['Only bot pull requests are open', `Turn off Hide bot PRs to see the ${plural(bots, 'pull request')} opened by bots.`]
          : terms.length ? ['No pull requests match', `Nothing here matches “${pv.q.trim()}”.`]
          : pv.view === 'proof' ? ['No proof yet', 'No open pull request here has a proof video or a screenshot.']
          : pv.view === 'ready' ? ['Nothing is ready to merge', 'No open pull request here has passing checks and a clear review.']
          : pv.view === 'failing' ? ['Nothing is failing', 'No open pull request here has failing checks or merge conflicts.']
          : ['No pull requests here', 'This repository has nothing open.'];
        const clear = el('button', { class: 'btn', type: 'button', 'data-k': 'clear', text: 'Show all pull requests' });
        clear.addEventListener('click', clearFilters);
        return [el('div', { class: 'card emptycard' }, el('h2', { text: title }), el('p', { text }), scope.length ? clear : null)];
      }
      if (pv.mode === 'list') return [sheet(proofFirst(shown), 'feed', 20)];
      if (pv.repo) return [sheet(proofFirst(shown), `repo:${pv.repo}`, 20)];
      const groups = new Map();
      for (const r of shown) groups.set(r.pr.repo, [...(groups.get(r.pr.repo) || []), r]);
      const withProof = ([, recs]) => recs.some((r) => r.pr.has_proof);
      return [...groups].sort((a, b) => withProof(b) - withProof(a) || byRank(a, b)).map(([repo, recs]) => {
        const isOpen = !pv.collapsed.has(repo);
        const proof = recs.filter((r) => r.pr.has_proof).length, bad = recs.filter((r) => failing(r.pr)).length;
        const head = el('button', { class: 'grp-h', type: 'button', 'aria-expanded': String(isOpen), 'data-k': `grp:${repo}`, title: repo },
          icon('chev'), el('b', { text: repoLabel(repo) }),
          el('span', {}, ...dotted([`${recs.length} open`, proof ? `${proof} with proof` : null, bad ? el('span', { class: 'bad-t', text: `${bad} failing` }) : null])));
        head.addEventListener('click', () => { isOpen ? pv.collapsed.add(repo) : pv.collapsed.delete(repo); savePv(); layoutPrs(); });
        return el('section', { class: 'grp' }, head, isOpen ? sheet(proofFirst(recs), `grp:${repo}`, 6) : null);
      });
    };

    const playing = [...ui.prList.querySelectorAll('video')].filter(isPlaying);
    keepFocus(ui.views.prs, () => {
      ui.prTitle.textContent = plural(scope.length, 'open pull request');
      ui.prSay.replaceChildren(...dotted([
        el('span', {}, 'across ', el('b', { text: repos.length }), repos.length === 1 ? ' repo' : ' repos'),
        el('span', {}, el('b', { text: scope.filter((r) => r.pr.has_proof).length }), ' with proof'),
        el('span', {}, el('b', { text: scope.filter((r) => r.pr.merge_ready).length }), ' ready to merge'),
        bots ? (pv.hideBots ? `${plural(bots, 'bot PR')} hidden` : `${bots} from bots`) : null]));
      ui.repoList.replaceChildren(repoRow(null, 'All repositories', scope), ...repos.map(([repo, recs]) => repoRow(repo, repoLabel(repo), recs)));
      ui.repoSelect.replaceChildren(el('option', { value: '', text: `All repositories (${scope.length})` }),
        ...repos.map(([repo, recs]) => el('option', { value: repo, text: `${repoLabel(repo)} (${recs.length})` })));
      ui.repoSelect.value = pv.repo || '';
      for (const b of ui.bots) { b.label.hidden = !bots; b.box.checked = pv.hideBots; b.count.textContent = bots; }
      ui.vtabs.replaceChildren(...VIEWS.map(([key, label, test]) => {
        const b = el('button', { class: 'vtab', type: 'button', 'aria-pressed': String(pv.view === key), 'data-k': `view:${key}` }, label,
          el('span', { class: 'n', text: inRepo.filter((r) => test(r.pr)).length }));
        b.addEventListener('click', () => { pv.view = key; layoutPrs(); });
        return b;
      }));
      ui.match.hidden = !terms.length || !shown.length;
      if (!ui.match.hidden) {
        const clear = el('button', { class: 'linkish', type: 'button', 'data-k': 'unsearch', text: 'Clear search' });
        clear.addEventListener('click', () => { pv.q = ''; ui.search.value = ''; layoutPrs(); });
        ui.match.replaceChildren(el('span', { text: `${shown.length} of ${inView.length} match “${pv.q.trim()}”` }), clear);
      }
      ui.prList.className = `pr-list${pv.mode === 'list' && !pv.repo ? ' mixed' : ''}`;
      ui.prList.replaceChildren(...feed());
    });
    // An entry that was only moved keeps playing; one that left the page stops.
    for (const video of playing) { if (!video.isConnected) video.pause(); else if (video.paused) video.play().catch(() => {}); }
    tickTimes();
  }

  function tickTimes() {
    const now = Date.now() / 1000;
    for (const t of document.querySelectorAll('time[data-ts]')) t.textContent = `${age(now - t.dataset.ts)} ago`;
    ui.stamp.textContent = prsProblem || (prs && prs.updated ? (now - prs.updated < 10 ? 'PR data from just now' : `PR data from ${age(now - prs.updated)} ago`) : '');
    ui.stamp.classList.toggle('bad', !!prsProblem);
  }

  async function refreshPrs(manual) {
    let data;
    ui.refresh.classList.add('busy');
    try {
      const response = await fetch('prs.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(response.status);
      data = await response.json();
      prsProblem = null;
    } catch {
      prsProblem = "Can't load pull requests from the hub";
      if (!prs) ui.prBlank.replaceChildren(el('div', { class: 'problem' }, el('b', { text: prsProblem }), 'Is `lanes hub` running? This retries every 30 seconds.'));
      tickTimes();
      return;
    } finally {
      ui.refresh.classList.remove('busy');
    }
    if (prs && JSON.stringify([data.configured, data.error, data.prs]) === prsSig) {      // nothing new: only the clock moved
      prs.updated = data.updated;
      pendingPrs = null;
      ui.pending.hidden = true;
      tickTimes();
    } else if (prs && manual !== true && prBusy()) {      // a video is playing or a search is being typed: wait to be asked
      pendingPrs = data;
      ui.pending.hidden = false;
    } else {
      applyPrs(data);
    }
  }

  // ---- the screenshot viewer: click a thumbnail to open it, click the image for full size, Esc or the backdrop closes
  function openLightbox(items, at, opener) {
    const img = el('img', { alt: '' });
    const label = el('span'), count = el('span', { class: 'n' });
    const source = el('a', { target: '_blank', rel: 'noopener noreferrer', text: 'Open source' });
    const stage = el('div', { class: 'lb-stage' }, img);
    const button = (cls, ic, name, act) => {
      const b = el('button', { class: `lb-btn ${cls}`, type: 'button', 'aria-label': name, title: name }, icon(ic));
      b.addEventListener('click', act);
      return b;
    };
    const show = () => {
      const m = items[lb.at], original = safe(m.original_url);
      node.classList.remove('actual');
      img.src = mediaSrc(m.src);
      img.alt = m.label || 'Screenshot';
      label.textContent = m.label || 'Screenshot';
      count.textContent = items.length > 1 ? `${lb.at + 1} of ${items.length}` : '';
      source.hidden = !original;
      if (original) source.href = original; else source.removeAttribute('href');
    };
    const go = (step) => { lb.at = (lb.at + step + items.length) % items.length; show(); };
    const node = el('div', { class: 'lb', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Screenshot viewer' },
      stage, el('div', { class: 'lb-bar' }, label, count, source),
      button('lb-x', 'x', 'Close', closeLightbox),
      items.length > 1 ? button('lb-prev', 'left', 'Previous image', () => go(-1)) : null,
      items.length > 1 ? button('lb-next', 'right', 'Next image', () => go(1)) : null);
    stage.addEventListener('click', (ev) => { if (ev.target === img) node.classList.toggle('actual'); else closeLightbox(); });
    lb = { node, opener, at, go, many: items.length > 1 };
    document.body.append(node);
    document.documentElement.style.overflow = 'hidden';
    show();
    node.querySelector('.lb-x').focus();
  }

  function closeLightbox() {
    if (!lb) return;
    lb.node.remove();
    document.documentElement.style.overflow = '';
    if (lb.opener && lb.opener.isConnected) lb.opener.focus();
    lb = null;
  }

  function lightboxKey(ev) {
    if (ev.key === 'Escape') { ev.preventDefault(); closeLightbox(); }
    else if (lb.many && ev.key === 'ArrowLeft') lb.go(-1);
    else if (lb.many && ev.key === 'ArrowRight') lb.go(1);
    else if (ev.key === 'Tab') {                 // keep the keyboard inside the viewer
      const stops = [...lb.node.querySelectorAll('button, a[href]')];
      ev.preventDefault();
      stops[(stops.indexOf(document.activeElement) + (ev.shiftKey ? -1 : 1) + stops.length) % stops.length].focus();
    }
  }

  // ---- live CI and queue: is it alive and what is it doing, then the runners and their room beside what is waiting
  // and what just finished, then the history and hardware charts. Runner capacity shows when the hub reads a queue.
  const STATES = {
    QUEUED: ['Waiting', 'In the line, waiting for a runner with room.'],
    CLAIMED: ['Claimed', 'Locked to one runner, so no other runner can start it.'],
    PROVISIONING: ['Starting', 'Its container or virtual machine is booting.'],
    RUNNING: ['Running', 'GitHub has confirmed the job is running.'],
    TEARING_DOWN: ['Cleaning up', 'The work is over and its machine is being wiped.'],
    DONE: ['Done', 'Finished and cleaned up.'],
    FAILED: ['Failed', 'Ended with a failure.'],
    CANCELLED: ['Cancelled', 'Stopped before it finished.'],
    LOST: ['Lost', 'Its runner went quiet. The queue notices and puts the job back in line by itself.'],
  };
  const EVENTS = {
    claim: 'A runner takes the job.',
    start_external: 'A runner outside the queue starts it.',
    provision: 'The runner starts booting its machine.',
    start: 'GitHub confirms it is running.',
    release: 'The runner hands it back to the line.',
    teardown: 'The work ends and cleanup begins.',
    complete: 'It finishes.',
    fail: 'It fails.',
    cancel: 'Someone cancels it.',
    lease_expired: 'The runner stopped checking in.',
    provision_failed: 'Its machine did not boot.',
    host_lost: 'The runner went offline.',
    requeue: 'The queue puts it back in line.',
  };
  const pretty = (s) => String(s || '').toLowerCase().replace(/_/g, ' ').replace(/^./, (c) => c.toUpperCase());
  const stateName = (s) => (STATES[s] ? STATES[s][0] : pretty(s));
  const LANES = { fast: ['Fast <1s', 'fast'], vm: ['Full VM', 'vm'] };
  const isCloud = (w) => w.boat_day_left != null || w.boat_hour_left != null;      // the queue's cloud runner reports its start allowance
  const hasLane = (w, lane) => (w.lanes || []).some((l) => String(l).toLowerCase() === lane);
  const ciUi = { allQueued: false };

  function runnerRow(w) {
    const cloud = isCloud(w), word = !w.online ? 'Offline' : w.paused_reason ? 'Paused' : w.draining ? 'Draining' : null;
    const gb = (free, whole, what) => `${n1(free)}${typeof whole === 'number' && whole > 0 ? ` of ${n1(whole)}` : ''} GB ${what} free`;
    const bar = (share, text) => el('div', { class: 'rn-bar' }, meter(share, 'var(--ink-2)', text), el('span', { text }));
    const row = el('div', { class: 'rn' }, el('div', { class: 'rn-h' },
      el('i', { class: `lamp${!w.online ? ' bad' : word ? ' warn' : ''}` }), el('b', { text: w.worker_id }),
      el('span', { text: (w.lanes || []).map((l) => laneOf(l, true)).join(' · ') }),
      el('span', { text: [word, plural(w.running_jobs || 0, 'job')].filter(Boolean).join(' · ') })));
    if (cloud && w.max_concurrent > 0) row.append(bar(w.running_jobs / w.max_concurrent, `${w.running_jobs} of ${w.max_concurrent} cloud machines in use`));
    else if (w.max_cpus > 0 && typeof w.free_cpus === 'number') row.append(bar(Math.max(0, w.max_cpus - w.free_cpus) / w.max_cpus, `${n1(w.free_cpus)} of ${w.max_cpus} CPUs free`));
    const facts = [];
    if (cloud) {
      if (w.boat_day_left != null) facts.push(`${w.boat_day_left} starts left today`);
      if (w.boat_hour_left != null) facts.push(`${w.boat_hour_left} this hour`);
    } else {
      if (typeof w.free_mem_gib === 'number') facts.push(gb(w.free_mem_gib, w.empty_mem_gib, 'memory'));
      if (typeof w.free_disk_gib === 'number') facts.push(gb(w.free_disk_gib, w.empty_disk_gib, 'disk'));
      if (typeof w.temp_c === 'number') {
        const hot = typeof w.max_temp_c === 'number' && w.temp_c >= w.max_temp_c;
        facts.push(el('span', { class: hot ? 'hot' : null, text: `${hot ? '▲ ' : ''}${n1(w.temp_c)} °C`,
          title: typeof w.max_temp_c === 'number' ? `Pauses at ${w.max_temp_c} °C` : null }));
      }
      if (typeof w.load_1m === 'number') facts.push(`load ${w.load_1m}`);
      if (w.primary_local) facts.push('first pick');
    }
    if (facts.length) row.append(el('p', { class: 'rn-facts' }, ...dotted(facts)));
    const note = w.paused_reason ? `Paused: ${w.paused_reason.replace(/^paused:?\s*/i, '')}`
      : w.draining ? 'Finishing its current jobs and taking no new ones.'
      : !w.online && typeof w.age_s === 'number' ? `Last heard from ${dur(w.age_s)} ago.` : null;
    if (note) row.append(el('p', { class: 'rn-note', text: note }));
    return row;
  }

  // Without a queue there are no runners to describe, so each machine stands in: is it answering, and how busy.
  function machineRow(m) {
    const row = el('div', { class: 'rn' }, el('div', { class: 'rn-h' }, el('i', { class: `lamp${m.ok ? '' : ' bad'}` }), el('b', { text: m.name }),
      el('span', { text: m.draining ? 'draining' : '' }), el('span', { text: m.ok ? plural(m.jobs.length, 'job') : 'Not answering' })));
    if (!m.ok) { row.append(el('p', { class: 'rn-note', text: m.error || 'no answer' })); return row; }
    if (m.cpu != null) row.append(el('div', { class: 'rn-bar' }, meter(m.cpu / 100, 'var(--ink-2)', 'CPU in use'), el('span', { text: `${Math.round(m.cpu)}% CPU in use` })));
    const heat = heatOf(m);
    const facts = [m.memFreeGiB != null ? `${n1(m.memFreeGiB)}${m.memGiB ? ` of ${n1(m.memGiB)}` : ''} GB memory free` : null,
      heat != null ? el('span', { class: m.hot ? 'hot' : null, text: `${m.hot ? '▲ ' : ''}${Math.round(heat)} °C` }) : null];
    if (facts.some((f) => f != null)) row.append(el('p', { class: 'rn-facts' }, ...dotted(facts)));
    return row;
  }

  function waitingPanel(queued) {
    const limit = ciUi.allQueued ? queued.length : 8;
    const card = el('section', { class: 'card' },
      blockHead('Waiting in line', `${plural(queued.length, 'job')}, longest wait ${waitFmt(Math.max(...queued.map((j) => j.waited_s || 0)))}`),
      ...waitRows(queued.slice(0, limit), true));
    if (queued.length > limit) {
      const more = el('button', { class: 'more', type: 'button', 'data-k': 'queue-more', text: `Show all ${queued.length} waiting jobs` });
      more.addEventListener('click', () => { ciUi.allQueued = true; render(); });
      card.append(more);
    }
    return card;
  }

  // The banner nobody can misread: jobs running and waiting with the running ones right under it, or all caught up
  // with who is online and the job that finished last.
  let allLive = false;                          // the banner lists every running job once asked
  function ciHero(p, now) {
    const f = p.fleet, last = p.last;
    const counts = [`${plural(p.live.length, 'job')} running`, status.queue ? `${p.queued.length} waiting in queue` : null].filter(Boolean);
    const title = problem ? ["Can't reach the Lanes hub"]
      : p.active ? counts.flatMap((part, i) => [i ? ' ' : null, el('span', { class: 'nb', text: i < counts.length - 1 ? `${part} ·` : part })])
      : [f.total && !f.online ? `No ${f.word} is online` : 'All caught up — CI is online and waiting for new jobs'];
    const sub = problem ? [`Showing what the hub last said, at ${clock.format(status.updated * 1000)}`] : [
      `${f.online} of ${plural(f.total, f.word)} online`,
      last ? el('span', {}, `Last job finished ${age(now - last.finished)} ago (`, el('b', { text: short(last.repo) }), ` · ${last.job} `,
          el('span', { class: last.result === 'failure' ? 'bad-t' : null, text: resultWord(last.result) }), `${last.machine ? ` on ${last.machine}` : ''})`)
        : 'No job has finished in the last 6 hours'];
    const cut = p.live.length > 9 && !allLive ? 8 : p.live.length;
    const more = cut < p.live.length ? el('button', { class: 'hero-more', type: 'button', 'data-k': 'live-more', text: `Show ${p.live.length - cut} more running` }) : null;
    if (more) more.addEventListener('click', () => { allLive = true; renderCi(); });
    return el('section', { class: `hero ${p.tone}` }, el('div', { class: 'hero-h' },
      !p.active && p.tone === 'good' ? icon('check') : el('i', { class: `lamp on ${p.tone}` }),
      el('div', {}, el('h1', {}, ...title), el('p', { class: 'hero-sub' }, ...dotted(sub)),
        ...p.warn.map((text) => el('p', { class: 'hero-alert', text })),
        p.live.length ? el('div', { class: 'hero-jobs' }, ...liveRows(p.live.slice(0, cut), now, true), more) : null)));
  }

  // One queue job as a row: who, where it is in its life, and for how long.
  function jobRow(j, now) {
    const since = j.started_at || j.claimed_at;
    const lane = (LANES[String(j.claimed_lane || '').toLowerCase()] || [j.claimed_lane])[0];
    const where = [j.claimed_by ? `on ${j.claimed_by}` : null, lane, j.size_name ? `size ${j.size_name}` : null, j.is_release ? 'release' : null].filter(Boolean);
    return el(safe(j.url) ? 'a' : 'div', { class: 'aj', href: safe(j.url), target: '_blank', rel: 'noopener noreferrer' },
      el('span', { class: 'dot', style: { background: names.includes(j.claimed_by) ? color(j.claimed_by) : 'var(--gone)' } }),
      el('div', { class: 'what' }, el('b', { text: short(j.repo) }), el('span', { text: `  ${j.job_name || 'job'}` })),
      el('div', { class: 'at' }, el('b', { text: stateName(j.state) }),
        j.state === 'QUEUED' && j.waited_s != null ? ` ${waitFmt(j.waited_s)}` : since && !j.finished_at ? ` ${dur(now - since)}` : ''),
      where.length ? el('div', { class: 'sub', text: where.join(', ') }) : null);
  }

  function renderCi() {
    const view = ui.views.ci;
    if (!status) { view.className = 'view'; view.replaceChildren(hubProblem()); return; }
    const now = Date.now() / 1000, q = status.queue, p = pulse();
    const workers = (q && q.workers) || [];
    chartW = view.clientWidth - (narrow() ? 30 : 42);        // a card's inner width
    const all = intervals(now);
    const kids = [
      ciHero(p, now),
      el('div', { class: 'duo' },
        el('section', { class: 'card' }, blockHead(workers.length ? 'Runners and capacity' : 'Machines', `${p.fleet.online} of ${p.fleet.total} online`),
          ...(workers.length ? workers.map(runnerRow) : real().map(machineRow)),
          q ? null : el('p', { class: 'note rn-tip' }, 'To see runner capacity and why each job is waiting, add a ', code('[queue]'), ' section to ', code('hub.toml'), '.')),
        el('div', { class: 'stack' }, p.queued.length ? waitingPanel(p.queued) : null,
          el('section', { class: 'card' }, blockHead('Recently finished', p.done.length ? `last 6 hours: ${tallyText(p.done)}` : null),
            ...(p.done.length ? doneRows(p.done.slice(0, 8), now, true) : [el('div', { class: 'empty', text: 'No job has finished in the last 6 hours.' })])))),
      el('div', { class: 'sect' }, el('h2', { text: 'History and hardware' }), el('span', { text: 'what ran in the last 6 hours, and what each whole machine is doing' })),
      el('section', { class: 'card' }, el('div', { class: 'blk-h' }, el('h2', { text: 'Jobs at once' }),
        el('div', { class: 'legend' }, ...names.map((m) => el('span', { class: 'key' }, el('span', { class: 'dot', style: { background: color(m) } }), m))),
        el('span', { style: { marginLeft: 0 }, text: 'last 6 hours' })), concurrency(now, all)),
      el('section', { class: 'card' }, blockHead('Last hour', 'bright: running · faded: passed · red: failed'), timeline(now, all)),
      el('section', { class: 'card' }, blockHead('Finished', 'last 6 hours, oldest first'), results()),
      el('section', { class: 'card' }, blockHead('Machines', 'whole machine, CI or not · lines: last 2 hours'), machineRows()),
    ];
    keepFocus(view, () => { view.className = 'view stack'; view.replaceChildren(...kids.filter(Boolean)); });
  }

  // ---- how CI works: the path of one job as four steps, with the live runners in each lane and the queue's own
  // state machine. Click a state to see where a job can go from it and which jobs are in it.
  const wire = (d) => el('svg:path', { class: 'wire', d });
  const flLink = (label, cls) => el('div', { class: `fl-link${cls ? ` ${cls}` : ''}`, 'aria-hidden': 'true' },
    el('svg:svg', { width: 24, height: 40, viewBox: '0 0 24 40' }, wire('M12 3v32'), wire('M7 30l5 6 5-6')), label ? el('span', { text: label }) : null);
  const THIRDS = ['16.1%', '50%', '83.9%'];
  function flBranch(split) {
    const svg = el('svg:svg', { class: 'fl-branch', 'aria-hidden': 'true' });
    const line = (x1, y1, x2, y2) => svg.append(el('svg:line', { class: 'wire', x1, y1, x2, y2 }));
    const head = (x) => svg.append(el('svg:svg', { x, y: 41, overflow: 'visible' }, wire('M-5 -6L0 0L5 -6')));
    if (split) {
      line('50%', 1, '50%', 18);
      line(THIRDS[0], 18, THIRDS[2], 18);
      for (const x of THIRDS) { line(x, 18, x, 40); head(x); }
    } else {
      for (const x of THIRDS) line(x, 3, x, 20);
      line(THIRDS[0], 20, THIRDS[2], 20);
      line('50%', 20, '50%', 40);
      head('50%');
    }
    return svg;
  }
  const stepHead = (n, title, text, where) => el('div', { class: 'node-h' }, el('span', { class: 'step', text: n }),
    el('div', { class: 'node-t' }, el('h3', { text: title }), el('p', { text })), where ? el('span', { class: 'where', text: where }) : null);

  function laneCard(cls, title, big, bigSub, text, workers, describe, none) {
    const body = el('div', { class: 'fl-lane-body' }, el('p', { text }));
    if (workers && workers.length) body.append(el('dl', { class: 'mini-dl' }, ...workers.map((w) => el('div', {}, el('dt', { text: w.worker_id }), el('dd', { text: describe(w) })))));
    else body.append(el('p', { class: 'fine', text: none }));
    return el('article', { class: 'card' }, el('div', { class: 'fl-lane-top' }, el('i', { class: `lg ${cls}` }), el('h3', { text: title })),
      el('p', { class: 'fl-big', text: big }), el('p', { class: 'fl-big-sub', text: bigSub }), body);
  }

  let smSel = null;
  let flowSig = '';
  const smWatch = 'ResizeObserver' in window ? new ResizeObserver(() => { if (smWatch.draw) smWatch.draw(); }) : null;

  function stateMachine(q) {
    const sm = q.state_machine || {}, states = sm.states || [], ends = new Set(sm.terminal || []);
    const counts = q.counts || {};
    if (!states.includes(smSel)) smSel = states.find((s) => counts[s] > 0 && !ends.has(s)) || states[0];
    const next = (sm.transitions || {})[smSel] || {};                 // event -> the state it leads to
    const via = new Map();
    for (const [ev, to] of Object.entries(next)) via.set(to, [...(via.get(to) || []), ev]);
    const pick = (s) => { smSel = s; flowSig = ''; render(); };
    const rowsOf = [states.filter((s) => !ends.has(s)), states.filter((s) => ends.has(s))].filter((r) => r.length);
    const cols = Math.max(1, ...rowsOf.map((r) => r.length));
    const nodes = new Map();
    const rows = rowsOf.map((row) => el('div', { class: 'sm-row', style: `--n:${cols}` }, ...row.map((s, i) => {
      const n = counts[s] || 0, evs = via.get(s);
      const b = el('button', { class: `sm-node${ends.has(s) ? ' end' : ''}${s === smSel ? ' sel' : evs ? ' to' : ' dim'}`, type: 'button', 'aria-pressed': String(s === smSel), 'data-k': `sm:${s}`,
        title: (STATES[s] || [])[1] || null, style: i === 0 && row.length < cols ? `grid-column-start:${Math.floor((cols - row.length) / 2) + 1}` : null },
        el('span', { class: 'sm-top' }, el('span', { class: `n${n ? '' : ' zero'}`, text: n }),
          evs ? el('span', { class: 'sm-ev', text: evs.join(', '), title: `from ${smSel}: ${evs.join(', ')}` }) : null),
        el('span', { class: 'nm', text: stateName(s) }), el('span', { class: 'cd', text: s }));
      b.addEventListener('click', () => pick(s));
      nodes.set(s, b);
      return b;
    })));
    const wires = el('svg:svg', { class: 'sm-wires', 'aria-hidden': 'true' });
    const box = el('div', { class: 'sm' }, ...rows, wires);

    // Arrows from the picked state to each state it can lead to, measured from where the nodes really sit.
    const draw = () => {
      wires.replaceChildren();
      const base = box.getBoundingClientRect();
      if (!base.width || narrow() || !nodes.has(smSel)) return;
      const at = (s) => { const r = nodes.get(s).getBoundingClientRect(); return { t: r.top - base.top, b: r.bottom - base.top, cx: (r.left + r.right) / 2 - base.left }; };
      const from = at(smSel);
      const firstRow = Math.min(...[...nodes.keys()].map((s) => at(s).t));
      const targets = [...via.keys()].filter((s) => nodes.has(s) && s !== smSel).map(at);
      const across = targets.filter((t) => Math.abs(t.t - from.t) >= 8);
      wires.append(el('svg:defs', {}, el('svg:marker', { id: 'sm-head', viewBox: '0 0 10 10', refX: 8.5, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' },
        el('svg:path', { d: 'M1.5 1.5L8.5 5L1.5 8.5' }))));
      for (const t of targets) {
        let d;
        if (Math.abs(t.t - from.t) < 8) {            // same row: over the top of the first row, under the bottom of a later one
          const up = from.t - firstRow < 8, dir = Math.sign(t.cx - from.cx), y = up ? from.t : from.b, out = up ? -1 : 1;
          const x1 = from.cx + dir * 14, x2 = t.cx - dir * 14, h = Math.min(36, 16 + Math.abs(x2 - x1) / 26);
          d = `M${x1},${y} C${x1},${y + out * h} ${x2},${y + out * h} ${x2},${y + out * 3}`;
        } else {
          const down = t.t > from.t, y1 = down ? from.b : from.t, y2 = down ? t.t - 3 : t.b + 3;
          const x1 = from.cx + (across.indexOf(t) - (across.length - 1) / 2) * 14, mid = (y1 + y2) / 2;
          d = `M${x1},${y1} C${x1},${mid} ${t.cx},${mid} ${t.cx},${y2}`;
        }
        wires.append(el('svg:path', { d, 'marker-end': 'url(#sm-head)' }));
      }
    };

    const here = [...(q.queued || []), ...(q.running || []), ...(q.recent || [])].filter((j) => j.state === smSel);
    const moves = el('ul', { class: 'sm-t' });
    for (const [ev, to] of Object.entries(next)) {
      const go = el('button', { class: 'linkish', type: 'button', 'data-k': `go:${ev}`, text: stateName(to), title: `Show ${to}` });
      go.addEventListener('click', () => pick(to));
      moves.append(el('li', {}, code(ev), go, el('span', { text: EVENTS[ev] || '' })));
    }
    const now = Date.now() / 1000;
    const detail = el('div', { class: 'sm-d' },
      el('div', {}, el('h4', {}, stateName(smSel), code(smSel)), el('p', { text: (STATES[smSel] || [])[1] || '' }),
        ...(moves.children.length ? [el('h5', { text: 'What can happen next' }), moves] : [el('p', { text: 'This is an end state. Nothing comes after it.' })])),
      el('div', {}, el('h5', { text: ends.has(smSel) ? `Latest jobs that ended here (${here.length})` : `Jobs here right now (${here.length})` }),
        ...(here.length ? here.slice(0, 8).map((j) => jobRow(j, now)) : [el('p', { text: 'No job is in this state.' })]),
        here.length > 8 ? el('p', { text: `and ${here.length - 8} more` }) : null));
    return { node: el('div', {}, box, detail), box, draw };
  }

  function renderFlow() {
    const view = ui.views.flow, q = status ? status.queue : null;
    const sig = JSON.stringify([innerWidth, smSel, q && [q.ok, q.error, q.counts, q.state_machine,
      (q.workers || []).map((w) => [w.worker_id, w.online, w.lanes, w.free_cpus, w.max_cpus, w.running_jobs, w.max_concurrent, w.paused_reason, w.draining, w.primary_local, w.boat_day_left]),
      [...(q.queued || []), ...(q.running || []), ...(q.recent || [])].map((j) => [j.job_id, j.state, j.is_release, j.claimed_by])]]);
    if (sig === flowSig) return;
    const workers = q ? q.workers || [] : null, online = workers ? workers.filter((w) => w.online) : [];
    const fast = online.filter((w) => hasLane(w, 'fast'));
    const local = online.filter((w) => !isCloud(w) && (w.lanes || []).some((l) => String(l).toLowerCase() !== 'fast'));
    const cloud = online.filter(isCloud);
    const queued = q ? q.queued || [] : [];
    const releases = queued.filter((j) => j.is_release).length;
    const room = (w) => (typeof w.free_cpus === 'number' && w.max_cpus ? `${n1(w.free_cpus)} of ${w.max_cpus} CPUs free` : plural(w.running_jobs || 0, 'job'));
    const held = (w) => (w.paused_reason ? ' Paused.' : w.draining ? ' Draining.' : '');

    // The line itself: one dot per waiting job, release jobs ringed at the front.
    const dots = q
      ? [...queued].sort((a, b) => Number(b.is_release) - Number(a.is_release)).slice(0, 18).map((j) => el('i', { class: j.is_release ? 'rel' : null }))
      : [el('i', { class: 'rel' }), el('i', { class: 'rel' }), el('i'), el('i'), el('i'), el('i'), el('i', { class: 'f1' }), el('i', { class: 'f2' }), el('i', { class: 'f3' })];
    const lineviz = el('div', { class: 'lineviz', role: 'img', 'aria-label': q ? `${plural(queued.length, 'job')} waiting, ${releases} of them release jobs` : 'Release jobs wait at the front of the line' },
      el('div', { class: 'lv-row' }, el('svg:svg', { width: 14, height: 12, viewBox: '0 0 14 12' }, wire('M13 6H2M6 2L2 6l4 4')), ...dots, el('span', { class: 'tail' })),
      el('div', { class: 'lv-caps' },
        q ? el('span', {}, el('b', { text: queued.length }), queued.length === 1 ? ' job waiting right now' : ' jobs waiting right now', releases ? `, ${releases} at the front for a release` : '')
          : el('span', { text: 'Front of the line: release and merge-train jobs' }),
        el('span', { text: 'New jobs join at the back' })));
    const fact = (ic, title, text) => el('div', {}, el('h4', {}, icon(ic), title), el('p', { text }));

    const machine = q && (q.state_machine || {}).states ? stateMachine(q) : null;
    const life = (cls, name, text) => el('li', { class: cls || null }, el('b', { text: name }), el('span', { text }));
    const kids = [
      el('div', { class: 'fl-intro' }, el('h1', { text: 'From push to green check' }),
        el('p', { text: 'Every job from every repo waits in one line. The line decides where each job runs, then watches it until it finishes.' })),
      el('div', { class: 'flow' },
        el('div', { class: 'card' }, stepHead(1, 'You push code or open a pull request', 'GitHub sends an instant notice that there is a job to run.', 'GitHub'),
          el('p', { class: 'tech' }, 'Under the hood, the notice is a ', code('workflow_job'), ' event, sent for every push and pull request.')),
        flLink('instant notice'),
        el('div', { class: 'card hub' }, stepHead(2, 'One global queue', 'The single source of truth. Every job waits here, and each runner asks the line for its next job.', 'The queue'),
          lineviz,
          el('div', { class: 'facts3' },
            fact('clock', 'It remembers', 'How much CPU, memory and time each job took last time, so it knows what fits where.'),
            fact('up', 'Release jobs go first', 'Release and merge-train jobs move to the front, ahead of everyday checks.'),
            fact('lock', 'One job, one runner', 'Each job is handed to exactly one runner, so nothing ever starts twice.'))),
        flLink(),
        el('div', { class: 'router' }, el('span', { class: 'step', text: 3 }), 'The router picks one lane for each job'),
        flBranch(true),
        flLink('one of these three', 'm'),
        el('div', { class: 'fl-lanes' },
          laneCard('fast', 'Fast lane', '< 1 s', 'to start', 'For small checks that finish in seconds. Each one runs in a locked-down container.',
            workers && fast, (w) => `${room(w)}.${held(w)}`, q ? 'No runner has the fast lane on right now.' : 'Any runner with the fast lane switched on.'),
          laneCard('vm', 'Local full VMs', q ? `${n1(local.reduce((sum, w) => sum + (w.free_cpus || 0), 0))} CPUs` : 'Full VM',
            q ? `free on ${plural(local.length, 'runner')} right now` : 'one for every job, on your own hardware',
            'Each job gets its own full virtual machine, on machines you already own.',
            workers && local, (w) => `${room(w)}.${w.primary_local ? ' First pick.' : ''}${held(w)}`, q ? 'No local runner is online right now.' : 'Your own machines, picked first.'),
          laneCard('cloud', 'Cloud overflow', q && cloud.length ? String(cloud.reduce((sum, w) => sum + (w.boat_day_left || 0), 0)) : 'Standby',
            q && cloud.length ? 'cloud starts left today' : 'used only when it is needed',
            'When the local runners are full or paused, heavy jobs spill over to rented cloud machines.',
            workers && cloud, (w) => `${w.max_concurrent ? `${w.running_jobs || 0} of ${w.max_concurrent} machines in use` : plural(w.running_jobs || 0, 'job')}.${w.boat_hour_left != null ? ` ${w.boat_hour_left} starts left this hour.` : ''}`,
            q ? 'No cloud runner is online right now.' : 'Rented machines, for the overflow.')),
        flBranch(false),
        flLink('whichever lane it takes', 'm'),
        el('div', { class: 'card' }, stepHead(4, 'Every job follows the same safe steps', machine
          ? 'A job only moves forward when the step before it is confirmed. These are the live counts. Pick a state to see where a job can go from there.'
          : 'Whichever lane it took, a job only moves forward when the step before it is confirmed.'),
          machine ? machine.node : el('ol', { class: 'life' }, life('', 'Queued', 'Waiting in the line.'), life('', 'Claimed', 'Locked to one runner.'),
            life('', 'Starting', 'Its VM or container boots.'), life('is-run', 'Running', 'Confirmed on GitHub.'), life('is-end', 'Finished', 'Done, failed or cancelled.')),
          el('p', { class: 'net' }, icon('spin'), el('span', {}, el('b', { text: 'Safety net. ' }), 'If a runner reboots or a job gets stuck, the queue notices and recovers the job by itself.')))),
    ];
    keepFocus(view, () => view.replaceChildren(...kids));
    if (smWatch) { smWatch.disconnect(); smWatch.draw = machine ? machine.draw : null; if (machine) smWatch.observe(machine.box); }
    if (machine) machine.draw();
    flowSig = sig;
  }

  function renderDashboard() {
    if (!tabChosen) { const t = defaultTab(); if (t && t !== tab) showTab(t); }
    renderTop();
    if (tab === 'ci') renderCi();
    else if (tab === 'flow') renderFlow();
    freshness();
  }

  function render() {
    hideTip();
    if (status) names = status.machines.map((m) => m.name);
    if (!host) { renderDashboard(); return; }
    if (!status) app.replaceChildren(hubProblem());
    else renderCompact(Date.now() / 1000);
    freshness();
    reportHeight();
  }

  async function refresh() {
    try {
      const response = await fetch('status.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(response.status);
      status = await response.json();
      problem = null;
    } catch {
      problem = "Can't reach the Lanes hub";
    }
    render();
  }

  // Esc closes the screenshot viewer when it is open. Otherwise Esc or Ctrl+Shift+C asks the host (menu bar panel or
  // T3 card) to close.
  addEventListener('keydown', (ev) => {
    if (lb) { lightboxKey(ev); return; }
    if (!host && !window.webkit?.messageHandlers?.lanes) return;
    const toggle = ev.ctrlKey && ev.shiftKey && !ev.metaKey && !ev.altKey && ev.code === 'KeyC';
    if (ev.key !== 'Escape' && !toggle) return;
    ev.preventDefault();
    if (host === 'embed') parent.postMessage({ type: 'lanes-close' }, '*');
    window.webkit?.messageHandlers?.lanes?.postMessage({ close: true });
  });
  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 80); });
  if (!host) {
    buildShell();
    if (hashTab()) { tabChosen = true; showTab(hashTab()); }
    addEventListener('hashchange', () => { const t = hashTab(); if (t && t !== tab) { tabChosen = true; showTab(t); render(); } });
    refreshPrs();
    setInterval(refreshPrs, 30000);
    setInterval(tickTimes, 15000);
  }
  refresh();
  setInterval(refresh, 5000);
  setInterval(freshness, 1000);
