<!doctype html>
<!-- Lanes: the page. `lanes hub` serves it at / with its data at /status.json and /prs.json. In a browser tab it is
     the dashboard: pull requests with their proof, live CI and the queue, and how CI works. The Lanes menu bar app
     (?in=menubar) and an iframe inside another app (?in=embed) get the compact panel instead: is CI alive, what is
     running, what just finished. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanes</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb;
    --plane: #f4f3f0;
    --well: #eeede9;
    --line: #dcdbd5;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #777670;
    --grid: #e6e5e1;
    --track: #ecebe7;
    --hover: rgba(0, 0, 0, .04);
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
    --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
    --good: #0ca30c;
    --bad: #d03b3b;
    --warn: #fab219;
    --gone: #b9b8b2;
    --info: #2a78d6;
    --bad-ink: #b3261e;
    --warn-ink: #8a5700;
    --info-ink: #1f5fae;
    --add: #006300;
    --del: #b3261e;
    --stage: #0d0d0c;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
      --grid: #2f2f2d; --track: #2a2a28; --hover: rgba(255, 255, 255, .05); --gone: #55544f;
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
      --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
      --plane: #111110; --well: #232322; --line: #353533;
      --info: #3987e5; --bad-ink: #e66767; --warn-ink: #fab219; --info-ink: #6ea8ee; --add: #0ca30c; --del: #e66767;
      --stage: #080808;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
    --grid: #2f2f2d; --track: #2a2a28; --hover: rgba(255, 255, 255, .05); --gone: #55544f;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --plane: #111110; --well: #232322; --line: #353533;
    --info: #3987e5; --bad-ink: #e66767; --warn-ink: #fab219; --info-ink: #6ea8ee; --add: #0ca30c; --del: #e66767;
    --stage: #080808;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: transparent; color: var(--ink); }
  html.menubar body { background: color-mix(in srgb, var(--surface) 86%, transparent); min-height: 100vh; }
  body { font: 12px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif; font-variant-numeric: tabular-nums;
         padding: 16px; -webkit-font-smoothing: antialiased; cursor: default; user-select: none; }
  a { color: inherit; text-decoration: none; }
  .legend { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 10px; color: var(--ink-2); font-size: 11px; }
  .key { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .fresh { color: var(--ink-3); font-size: 11px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .fresh.stale { color: var(--bad); }
  svg { display: block; overflow: visible; max-width: 100%; height: auto; }
  svg text { fill: var(--ink-3); font-size: 10px; font-variant-numeric: tabular-nums; }
  .mcard { padding: 12px 0; position: relative; }
  .mhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
  .mname { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; white-space: nowrap; }
  .chip { font-size: 11px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip.hot { color: #fff; background: var(--bad); font-weight: 600; padding: 1px 7px; border-radius: 9px; }
  .mhead .slots { flex: none; height: 7px; }
  .mmeta { color: var(--ink-3); font-size: 11px; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mmeta.err { color: var(--bad); white-space: normal; }
  .mmeta.warn { color: var(--ink-2); }
  .tiles4 { display: grid; gap: 6px; margin-top: 9px; }
  @media (max-width: 400px) { .tiles4 { grid-template-columns: 1fr 1fr !important; } .mhead .slots { display: none; } }
  .tile { border: 1px solid var(--grid); border-radius: 8px; padding: 6px 8px 5px; min-width: 0; }
  .tile.hot { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, transparent); }
  .tile .lab { display: flex; justify-content: space-between; gap: 4px; font-size: 10.5px; color: var(--ink-3); }
  .tile .lab .flag { font-weight: 600; color: var(--bad); }
  .tile .lab .flag.warm { color: var(--ink-2); }
  .tile .lab .flag.info { color: var(--ink-3); font-weight: 400; }
  .tile .val { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .tile .val small { font-size: 11px; font-weight: 500; color: var(--ink-3); margin-left: 1px; }
  .tile .sub { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .tile svg { margin-top: 4px; width: 100%; height: 24px; }
  .tile.none .val { color: var(--ink-3); }
  .procs { display: grid; grid-template-columns: minmax(0, 1fr) 90px 34px; column-gap: 8px; row-gap: 3px; align-items: center;
           margin-top: 8px; font-size: 11px; font-variant-numeric: tabular-nums; }
  .procs .pl { grid-column: 1 / -1; color: var(--ink-3); font-size: 10.5px; }
  .procs .pn { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--ink-2); }
  .procs .pv { text-align: right; color: var(--ink-2); }
  .procs .meter { height: 6px; }
  .vrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; align-items: center; margin-top: 7px; }
  .slots { display: flex; gap: 2px; height: 8px; }
  .slots i { flex: 1; border-radius: 2px; background: var(--track); }
  .meter { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 4px; }
  .empty { color: var(--ink-3); padding: 4px 0; }
  .tally { display: flex; gap: 12px; color: var(--ink-2); font-size: 11px; margin-bottom: 9px; font-variant-numeric: tabular-nums; }
  .tally b { color: var(--ink); font-weight: 600; }
  .ok-i { color: var(--good); } .bad-i { color: var(--bad); }
  .tiles { display: flex; flex-wrap: wrap; gap: 2px; }
  .tiles a, .tiles span { width: 7px; height: 7px; border-radius: 2px; }
  .tiles a:hover, .tiles span:hover { outline: 1.5px solid var(--ink); outline-offset: 1px; }
  #tip { position: fixed; z-index: 10; pointer-events: none; max-width: 270px; padding: 7px 9px; border-radius: 7px; font-size: 11px;
         line-height: 1.45; white-space: pre-line; background: var(--ink); color: var(--surface); opacity: 0; transition: opacity .1s;
         box-shadow: 0 4px 16px rgba(0, 0, 0, .25); }
  #tip b { font-weight: 600; }
  .problem { padding: 28px 4px; text-align: center; color: var(--ink-2); line-height: 1.5; }
  .problem b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 4px; }
  @keyframes breathe { 0%, 100% { opacity: .3; } 50% { opacity: .85; } }
  .live { animation: breathe 2.4s ease-in-out infinite; }
  .ic { display: inline-block; flex: none; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .bad-t { color: var(--bad-ink); font-weight: 600; }

  /* ---- the signal lamp: green and pulsing while fresh data arrives, amber when something needs a look, red when
     the hub has gone quiet */
  .lamp { position: relative; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  .lamp.warn { background: var(--warn); }
  .lamp.bad { background: var(--bad); }
  .lamp.on::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: inherit; animation: ping 2.4s cubic-bezier(0, 0, .2, 1) infinite; }
  @keyframes ping { from { transform: scale(1); opacity: .5; } 70%, to { transform: scale(2.8); opacity: 0; } }
  html.stale .lamp { background: var(--bad); }
  html.stale .lamp::after { display: none; }

  /* ---- one job, one row: a mark, what it is, where it ran, when */
  .jl { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto; column-gap: 8px; align-items: center; min-height: 26px; padding: 3px 8px; margin: 0 -8px; border-radius: 6px; }
  a.jl:hover { background: var(--hover); }
  .jl .lead { justify-self: center; }
  .lead.dot, .lead.ring { width: 8px; height: 8px; border-radius: 50%; }
  .lead.ring { border: 1.5px solid var(--ink-3); }
  .lead.ic { stroke-width: 2; }
  .lead.ok { color: var(--good); }
  .lead.no { color: var(--bad); }
  .lead.na { color: var(--ink-3); }
  .jl .what { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .jl .what b { font-weight: 600; }
  .jl .what span { color: var(--ink-2); }
  .jl .what .rel { margin-left: 2px; font-size: .9em; font-weight: 500; color: var(--info-ink); }
  .jl .spot, .jl .when, .jl .sub { font-size: 11px; }
  .jl .spot { max-width: 170px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--ink-3); }
  .jl .when { min-width: 44px; text-align: right; white-space: nowrap; color: var(--ink-2); }
  .jl .sub { grid-column: 2 / -1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--ink-3); }
  .jl .sub.full { white-space: normal; overflow-wrap: anywhere; }
  .jl .bar { grid-column: 2 / -1; height: 3px; margin: 1px 0 2px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .jl .bar i { display: block; height: 100%; border-radius: 2px; }

  /* ---- compact layout: the menu bar panel and a card inside another app */
  .c-head { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; column-gap: 8px; align-items: start; }
  .c-head .lamp { margin: 5px 4px 0; }
  .c-title { font-size: 14px; font-weight: 600; line-height: 18px; }
  .c-sub, .c-alert { margin-top: 2px; font-size: 11.5px; line-height: 16px; color: var(--ink-2); overflow-wrap: anywhere; }
  .c-sub b { font-weight: 600; color: var(--ink); }
  .c-alert { display: flex; gap: 6px; color: var(--ink); }
  .c-alert::before { content: '▲'; flex: none; font-size: 9px; color: var(--warn-ink); }
  .c-head .fresh { margin: 2px 0 0; white-space: nowrap; }
  .c-label { display: flex; align-items: baseline; gap: 8px; margin: 16px 0 4px; font-size: 11px; font-weight: 600; color: var(--ink-2); }
  .c-label span + span { margin-left: auto; font-weight: 400; color: var(--ink-3); }
  .c-more { display: block; padding: 2px 0 0 24px; font-size: 11px; color: var(--ink-3); }
  .c-more:hover { color: var(--ink); }
  .c-machines { margin-top: 16px; }
  .mt.trouble .mt-row { background: color-mix(in srgb, var(--bad) 9%, transparent); }
  .mt.trouble .mt-row:hover { background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .mt, .mt-cols { margin: 0 -8px; }
  .mt-cols, .mt-row { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 54px) 12px; column-gap: 10px; align-items: center; padding: 0 8px; }
  .mt-cols { font-size: 10px; color: var(--ink-3); padding-bottom: 2px; }
  .mt-cols span { text-align: right; }
  .mt-row { padding-top: 7px; padding-bottom: 7px; border-radius: 7px; cursor: pointer; }
  .mt-row:hover { background: var(--hover); }
  .mt-row:focus-visible { outline: 2px solid var(--c1); outline-offset: -2px; }
  .mt-name { min-width: 0; }
  .mt-name .mname { font-size: 12.5px; }
  .mt-why { color: var(--ink-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 1px 0 0 14px; }
  .cell { text-align: right; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cell.na { color: var(--gone); font-weight: 400; }
  .cell.bad { color: var(--bad); }
  .cell i { display: block; height: 3px; border-radius: 2px; background: var(--track); margin-top: 3px; overflow: hidden; }
  .cell i b { display: block; height: 100%; border-radius: 2px; }
  .chev { color: var(--ink-3); font-size: 10px; transition: transform .15s; text-align: center; }
  .open .chev { transform: rotate(90deg); }
  .mt-more { padding: 2px 8px 12px 22px; }
  .mt-more .kv { color: var(--ink-3); font-size: 11px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .multi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 8px 0 4px; }
  .multi .lab { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .multi .lab b { color: var(--ink-2); font-weight: 600; }
  .multi svg { width: 100%; height: 28px; margin-top: 2px; }
  .mt + .mt { border-top: 1px solid var(--grid); }
  .mt-cols span:first-child { text-align: left; font-size: 11px; font-weight: 600; color: var(--ink-2); }
  .c-meter { margin-top: 4px; }
  .c-meter .meter { height: 3px; margin-top: 6px; }
  .foot { display: flex; align-items: center; gap: 16px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--grid); font-size: 11.5px; color: var(--ink-3); }
  .foot a { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); white-space: nowrap; }
  .foot a:hover { color: var(--ink); }
  .foot .ic { width: 12px; height: 12px; }
  .foot > span { margin-left: auto; white-space: nowrap; }

  /* ---- the dashboard: the page in a browser tab */
  html.standalone { scrollbar-gutter: stable; }
  html.standalone body { background: var(--plane); min-height: 100vh; padding: 0; font-size: 14px; line-height: 1.5; cursor: auto; user-select: text; }
  html.standalone :where(button, a, input, select):focus-visible { outline: 2px solid var(--c1); outline-offset: 2px; }
  html.standalone :where(.tab, .vtab, .repo):focus-visible { outline-offset: -2px; }
  :where(html.standalone) :where(h1, h2, h3, h4, h5, p, ul, ol, dl, dd, figure) { margin: 0; padding: 0; }
  :where(html.standalone) :where(ul, ol) { list-style: none; }
  html.standalone code { font: 0.9em var(--mono); background: var(--well); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  .wrap { max-width: 1128px; margin: 0 auto; padding: 0 24px; }
  .top { position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line);
         background: color-mix(in srgb, var(--plane) 88%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px); }
  .top-row { display: flex; align-items: center; column-gap: 28px; min-height: 52px; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .glyph { display: grid; place-items: center; width: 18px; height: 18px; }
  .tabs { display: flex; align-self: stretch; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border: 0; background: none;
         font: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
  .tab:hover { color: var(--ink); }
  .tab .n { font-size: 12.5px; font-weight: 400; color: var(--ink-3); }
  .tab[aria-selected="true"] { color: var(--ink); }
  .tab[aria-selected="true"]::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--ink); }
  .livebox { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 12.5px; white-space: nowrap; }
  .live-btn { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border: 0; border-radius: 7px; background: none;
              font: inherit; font-weight: 500; color: var(--ink); cursor: pointer; }
  .live-btn:hover { background: var(--hover); }
  .livebox .fresh { margin: 0; font-size: 12.5px; }
  .view { padding: 28px 0 80px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; min-width: 0; }
  .stack { display: grid; gap: 12px; align-content: start; }
  .stack > * { min-width: 0; }
  .blk-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin-bottom: 8px; }
  .blk-h h2 { font-size: 15px; font-weight: 600; }
  .blk-h > span { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }
  .note { font-size: 13px; color: var(--ink-2); }
  .note.warn { padding: 8px 12px; border-radius: 8px; color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 60%, var(--line));
               background: color-mix(in srgb, var(--warn) 12%, var(--surface)); }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
         background: var(--surface); color: var(--ink); font: inherit; font-size: 12.5px; white-space: nowrap; cursor: pointer; }
  .btn:hover { border-color: var(--ink-3); }
  .iconbtn { display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px; background: none; color: var(--ink-2); cursor: pointer; }
  .iconbtn:hover { background: var(--hover); color: var(--ink); }
  .iconbtn.busy .ic { animation: turn .8s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .linkish { padding: 0; border: 0; background: none; font: inherit; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .more { display: block; width: 100%; padding: 10px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink-2);
          font: inherit; font-size: 12.5px; text-align: center; cursor: pointer; }
  .more:hover { color: var(--ink); }
  .sheet > .more { border-radius: 0 0 11px 11px; }
  .card > .more { margin: 8px 0 -8px; padding-bottom: 8px; }
  html.standalone .jl { min-height: 32px; padding: 4px 8px; font-size: 13.5px; }
  html.standalone .jl .spot, html.standalone .jl .when, html.standalone .jl .sub { font-size: 12.5px; }
  html.standalone .jl .spot { max-width: 260px; }
  html.standalone .jl .when { min-width: 60px; }
  html.standalone .empty { padding: 6px 0; font-size: 13px; color: var(--ink-2); }

  /* pull requests: a rail of repositories, one row of views, then the reel */
  .pr-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 24px; }
  .pr-top h1 { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .pr-say { margin-top: 4px; font-size: 13.5px; color: var(--ink-2); text-wrap: pretty; }
  .pr-say b { font-weight: 600; color: var(--ink); }
  .pr-stamp { display: flex; align-items: center; gap: 4px; margin-left: auto; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
  .pr-stamp .bad { color: var(--bad-ink); }
  .pr-note { margin-top: 12px; }
  .pr-grid { display: grid; grid-template-columns: 220px minmax(0, 820px); gap: 40px; align-items: start; margin-top: 24px; }
  .rail { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow-y: auto; scrollbar-width: thin; }
  .rail h2 { margin-bottom: 8px; padding: 0 8px; font-size: 12.5px; font-weight: 500; line-height: 20px; color: var(--ink-3); }
  .rail ul { display: grid; gap: 2px; }
  .repo { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 8px; border: 0; border-radius: 6px; background: none;
          font: inherit; font-size: 13.5px; color: var(--ink-2); text-align: left; cursor: pointer; }
  .repo:hover { background: var(--hover); color: var(--ink); }
  .repo[aria-pressed="true"] { background: var(--well); color: var(--ink); font-weight: 600; }
  .repo .nm { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .repo .ct { min-width: 20px; text-align: right; font-size: 12.5px; font-weight: 400; color: var(--ink-3); }
  .mk { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--bad); }
  .mk.vid { height: 8px; border-radius: 0; background: var(--ink-3); clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .mk.pic { border: 1.5px solid var(--ink-3); border-radius: 2px; background: none; }
  .mk.off { visibility: hidden; }

  /* screenshot viewer */

  .lb-bar .n, .lb-bar a { color: #c3c2b7; font-variant-numeric: tabular-nums; }
  .lb-bar a { text-decoration: underline; text-underline-offset: 2px; }
  .lb-btn { position: absolute; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 1px solid rgba(255, 255, 255, .28); border-radius: 50%;
            background: rgba(26, 26, 25, .85); color: #f0efec; cursor: pointer; }
  .lb-btn:hover { border-color: #f0efec; }
  .lb-btn .ic { width: 16px; height: 16px; }
  .lb-x { top: 14px; right: 16px; }
  .lb-prev { left: 14px; top: 50%; margin-top: -18px; }
  .lb-next { right: 14px; top: 50%; margin-top: -18px; }

  @media (max-width: 780px) {
    .wrap { padding: 0 16px; }
    .card { padding: 14px; }
    .top { top: calc(-1 * var(--row-h, 0px)); }
    .top-row { flex-wrap: wrap; min-height: 0; }
    .brand { height: 44px; }
    .tabs { order: 3; flex: 1 0 100%; height: 40px; margin: 0 -8px; }
    .livebox .fresh:not(.stale) { display: none; }
    .view { padding: 20px 0 64px; }
    .pr-grid { grid-template-columns: minmax(0, 1fr); margin-top: 16px; }
    .rail { display: none; }
    .rail-m { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 12px; }
    .rail-m select { flex: 1 1 200px; min-width: 0; height: 36px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
                     font: inherit; font-size: 16px; }
    .rail-m .tick span { margin-left: 0; }
    .pr-bar { flex-wrap: wrap; }

    .search { flex: 1 1 0; margin-left: 0; }

    .search input { height: 36px; font-size: 16px; }
    .modes button { width: 36px; height: 34px; }
    .pr { padding: 14px; }
    .pr-foot { gap: 4px 12px; }
    .reel.two, .reel.three { grid-template-columns: minmax(0, 1fr); }
    .reel.shots.two, .reel.shots.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hero { padding: 16px; }
    .hero h1 { font-size: 18px; line-height: 24px; }
    .duo, .mgrid { grid-template-columns: minmax(0, 1fr); }
    html.standalone .jl { grid-template-columns: 16px minmax(0, 1fr) auto; }
    html.standalone .jl .spot { grid-column: 2 / -1; grid-row: 2; max-width: none; }
    .node-h { flex-wrap: wrap; }
    .node-t { flex-basis: calc(100% - 36px); }
    .where { margin-left: 36px; }
    .tech, .lineviz, .life, .net, .sm, .sm-d { margin-left: 0; }
    .fl-branch { display: none; }
    .fl-link.m { display: grid; }
    .facts3, .fl-lanes, .sm-d { grid-template-columns: minmax(0, 1fr); }
    .facts3 > div, .facts3 > div + div { padding: 12px 0; border-left: 0; }
    .facts3 > div + div { border-top: 1px solid var(--line); }
    .facts3 > div:last-child { padding-bottom: 0; }

    .life li::before { top: 4px; }
    .life li::after { left: 5.25px; right: auto; top: 20px; bottom: 0; border-top: 0; border-left: 1.5px solid var(--line); }

  }
  /* a phone keeps the entry's last line to one line: the check count without its bar, the link as its arrow */
  @media (max-width: 480px) {
    .pr-foot .cibar { display: none; }
    .pr-open { position: relative; margin: -6px -6px -6px auto; padding: 6px; }
    .pr-open span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .pr-open .ic { width: 14px; height: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .live, .lamp.on::after, .sdot.running, .iconbtn.busy .ic { animation: none; }
    .chev, .grp-h .ic, .disc .ic, .sm-node { transition: none; }

</style>
</head>
<body>
<div id="app"><div class="problem">Loading…</div></div>
<div id="tip" role="tooltip"></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const host = params.get('in');               // menubar, embed (an iframe in another app), or none (a browser tab)
  document.documentElement.classList.add(host === 'menubar' ? 'menubar' : host ? 'embedded' : 'standalone');
  if (host) document.body.classList.add('compact');
  if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme');

  const clock = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit' });
  const hourFmt = new Intl.DateTimeFormat('en-US', { hour: 'numeric' });
  const app = document.getElementById('app');
  const tip = document.getElementById('tip');
  const NS = 'http://www.w3.org/2000/svg';
  let status = null;
  let problem = null;
  let names = [];                               // machine order, which fixes each machine's color
  let chartW = 0;                               // the width charts draw at, when it is not the whole page

  // Colors follow the machine, never its rank: slot by position in the hub's list (8 slots, then they repeat).
  const color = (name) => `var(--c${(Math.max(0, names.indexOf(name)) % 8) + 1})`;
  const resultColor = { success: 'var(--good)', failure: 'var(--bad)' };

  // Every node is built here and text only ever lands in textContent, so a PR title or job name can't become markup.
  const el = (tag, attrs = {}, ...kids) => {
    const node = tag.startsWith('svg:') ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else if (k === 'text') node.textContent = v;
      else node.setAttribute(k, v);
    }
    node.append(...kids.filter((k) => k != null));
    return node;
  };
  const dur = (s) => {
    s = Math.max(0, Math.round(s));
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.floor(s / 60)}m`;
    return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
  };
  const short = (repo) => (repo || '').split('/').pop();
  const median = (xs) => { const s = [...xs].sort((a, b) => a - b); return s.length ? s[Math.floor(s.length / 2)] : null; };
  const width = () => Math.max(260, chartW || app.clientWidth);
  const verdict = (r) => (r === 'success' ? '✓ passed' : r === 'failure' ? '✗ failed' : `– ${r}`);

  // Every job as an interval: finished ones from the last 6 hours, plus the ones running now.
  const intervals = (now) => {
    const done = status.history.filter((j) => j.started).map((j) => ({ ...j, s: j.started, e: j.finished }));
    const live = status.machines.flatMap((m) => m.jobs.filter((j) => (j.state || 'running') === 'running' && j.since)
      .map((j) => ({ ...j, machine: m.name, s: j.since, e: now, live: true })));
    return [...done, ...live];
  };
  const usualTimes = () => {
    const by = new Map();
    for (const j of status.history) {
      if (!j.started || j.result !== 'success') continue;
      const key = `${j.repo}\u0000${j.job}`;
      by.set(key, [...(by.get(key) || []), j.finished - j.started]);
    }
    return (j) => median(by.get(`${j.repo}\u0000${j.job}`) || []);
  };
  const tipFor = (j, now) => {
    const lines = [`${short(j.repo)} · ${j.job || 'waiting for a job'}`, [j.machine, j.label].filter(Boolean).join(' · ')];
    if (j.live) lines.push(`running ${dur(now - j.s)}, since ${clock.format(j.s * 1000)}`);
    else lines.push(`${verdict(j.result)}${j.s ? ` in ${dur(j.e - j.s)}` : ''}, at ${clock.format(j.e * 1000)}`);
    if (safe(j.url)) lines.push('Click to open on GitHub');
    return lines.join('\n');
  };
  // Links come from agents and sources; only web links are followed.
  const safe = (url) => (typeof url === 'string' && /^https?:\/\//i.test(url) ? url : null);
  const open = (url) => { if (safe(url)) window.open(safe(url), '_blank', 'noopener'); };
  const hoverable = (node, text) => {
    node.addEventListener('mousemove', (ev) => showTip(ev, typeof text === 'function' ? text() : text));
    node.addEventListener('mouseleave', hideTip);
    return node;
  };

  // ---- 6 hours as stacked columns: jobs running at once per machine, averaged over each 10 minutes
  function concurrency(now, all) {
    const W = width(), H = 84, top = 16, bottom = 16;
    const span = 6 * 3600, bucket = 600, t0 = now - span, n = span / bucket;
    const cols = [];
    for (let b = 0; b < n; b++) {
      const a = t0 + b * bucket, per = names.map(() => 0);
      for (let t = a; t < a + bucket; t += 60) {
        names.forEach((m, mi) => { per[mi] += all.filter((j) => j.machine === m && j.s <= t && j.e > t).length / 10; });
      }
      cols.push({ a, per });
    }
    const peak = Math.max(4, Math.ceil(Math.max(...cols.map((c) => c.per.reduce((x, y) => x + y, 0)))));
    const slot = W / n, colW = Math.max(3, Math.min(24, slot - 2));
    const y = (v) => top + (H - top - bottom) * (1 - v / peak);
    const svg = el('svg:svg', { width: '100%', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Jobs running at once over the last 6 hours, by machine' });
    svg.append(el('svg:line', { x1: 0, x2: W, y1: y(peak), y2: y(peak), stroke: 'var(--grid)', 'stroke-width': 1 }));
    svg.append(el('svg:text', { x: 0, y: y(peak) - 5, text: `${peak} at once` }));
    svg.append(el('svg:line', { x1: 0, x2: W, y1: y(0) + 0.5, y2: y(0) + 0.5, stroke: 'var(--grid)', 'stroke-width': 1 }));
    for (let t = Math.ceil(t0 / 3600) * 3600; t < now - 1500; t += 3600) {
      if (((t / 3600) % 2) !== 0) continue;
      svg.append(el('svg:text', { x: ((t - t0) / span) * W, y: H - 3, 'text-anchor': 'middle', text: hourFmt.format(t * 1000) }));
    }
    svg.append(el('svg:text', { x: W, y: H - 3, 'text-anchor': 'end', text: 'now' }));
    cols.forEach((c, i) => {
      const cx = i * slot + (slot - colW) / 2;
      let level = 0;
      const g = el('svg:g');
      names.forEach((m, mi) => {
        const v = c.per[mi];
        if (v < 0.05) return;
        const y1 = y(level + v), y2 = y(level) - (level ? 2 : 0);      // 2px surface gap between stacked parts
        level += v;
        if (y2 - y1 < 1) return;
        g.append(el('svg:rect', { x: cx, y: y1, width: colW, height: y2 - y1, rx: Math.min(2, (y2 - y1) / 2), fill: color(m) }));
      });
      const hit = hoverable(el('svg:rect', { x: i * slot, y: 0, width: slot, height: H - bottom, fill: 'transparent' }),
        `${clock.format(c.a * 1000)} – ${clock.format((c.a + bucket) * 1000)}, average at once\n` +
        names.map((m, mi) => `${m}  ${c.per[mi].toFixed(1)}`).join('\n'));
      svg.append(g, hit);
    });
    return svg;
  }

  // ---- per machine: one tile per reading (CPU, GPU, memory, heat), each with its 2-hour line, then the busiest programs
  const HOT_C = 90, WARM_C = 80, GPU_HOT_C = 85;
  const series = (m, key) => status.samples.filter((s) => s[m.name] && s[m.name][key] != null).map((s) => [s.t, s[m.name][key]]);

  // A small area chart with a hover crosshair. lo..hi fixes the scale; marks are dashed lines such as the heat limits.
  function spark(pts, { lo = 0, hi = 100, stroke, marks = [], fmt, title }) {
    const W = 100, H = 24;
    const svg = el('svg:svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none' });
    if (pts.length < 2) return svg;
    const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
    const x = (t) => ((t - t0) / Math.max(1, t1 - t0)) * W;
    const y = (v) => 1.5 + (H - 3) * (1 - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo));
    for (const mk of marks) {
      svg.append(el('svg:line', { x1: 0, x2: W, y1: y(mk.v), y2: y(mk.v), stroke: mk.color, 'stroke-width': 1,
        'stroke-dasharray': '3 2', 'vector-effect': 'non-scaling-stroke', opacity: 0.8 }));
    }
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(2)},${y(p[1]).toFixed(2)}`).join('');
    svg.append(el('svg:path', { d: `${d}L${W},${H}L0,${H}Z`, fill: stroke, 'fill-opacity': 0.13 }));
    svg.append(el('svg:path', { d, fill: 'none', stroke, 'stroke-width': 1.5, 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke' }));
    const cross = el('svg:line', { y1: 0, y2: H, stroke: 'var(--ink-3)', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke', opacity: 0 });
    svg.append(cross);
    const peak = Math.max(...pts.map((p) => p[1]));
    const avg = pts.reduce((a, p) => a + p[1], 0) / pts.length;
    svg.addEventListener('mousemove', (ev) => {
      const r = svg.getBoundingClientRect();
      const t = t0 + ((ev.clientX - r.left) / r.width) * (t1 - t0);
      const p = pts.reduce((best, q) => (Math.abs(q[0] - t) < Math.abs(best[0] - t) ? q : best));
      cross.setAttribute('x1', x(p[0])); cross.setAttribute('x2', x(p[0])); cross.setAttribute('opacity', 1);
      showTip(ev, `${title} at ${clock.format(p[0] * 1000)}: ${fmt(p[1])}\nlast ${dur(t1 - t0)}: peak ${fmt(peak)} · average ${fmt(avg)}`);
    });
    svg.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); hideTip(); });
    return svg;
  }

  function tile({ label, value, unit, sub, chart, flag, flagClass, hot, none }) {
    return el('div', { class: `tile${hot ? ' hot' : ''}${none ? ' none' : ''}` },
      el('div', { class: 'lab' }, el('span', { text: label }), flag ? el('span', { class: `flag ${flagClass || (hot ? '' : 'warm')}`, text: flag }) : null),
      el('div', { class: 'val' }, value, unit ? el('small', { text: unit }) : null),
      el('div', { class: 'sub', text: sub || ' ', title: sub || null }),
      chart || el('svg:svg', { viewBox: '0 0 100 24' }));
  }

  const pct = (v) => `${Math.round(v)}%`;
  const deg = (v) => `${Math.round(v)}°C`;
  const heatFlag = (c, hot) => (c == null ? null : c >= hot ? '▲ hot' : c >= WARM_C ? 'warm' : null);

  function tiles(m) {
    const c = color(m.name), out = [];
    if (m.cpu != null) {
      out.push(tile({ label: 'CPU', value: Math.round(m.cpu), unit: '%', flag: m.cores ? `${m.cores} cores` : null, flagClass: 'info',
        sub: m.load != null ? `load ${m.load}` : null,
        chart: spark(series(m, 'cpu'), { stroke: c, fmt: pct, title: `${m.name} CPU` }) }));
    }
    (m.gpus || []).forEach((g, i) => {
      const mem = g.memUsedGiB != null && g.memGiB ? `${g.memUsedGiB} / ${Math.round(g.memGiB)} GB` : g.name;
      out.push(tile({ label: (m.gpus.length > 1 ? `GPU ${i + 1}` : 'GPU'), value: g.busy != null ? Math.round(g.busy) : '–', unit: g.busy != null ? '%' : '',
        sub: mem, chart: i === 0 ? spark(series(m, 'gpu'), { stroke: c, fmt: pct, title: `${m.name} GPU` }) : null }));
    });
    if (m.memFreeGiB != null) {
      const total = m.memGiB, used = total ? Math.max(0, total - m.memFreeGiB) : null;
      out.push(used != null
        ? tile({ label: 'Memory', value: Math.round((100 * used) / total), unit: '%', sub: `${Math.round(used)} / ${Math.round(total)} GB`,
            chart: spark(series(m, 'mem'), { stroke: c, fmt: pct, title: `${m.name} memory used` }) })
        : tile({ label: 'Memory', value: Math.round(m.memFreeGiB), unit: ' GB', sub: 'free' }));
    }
    if (m.cpu != null || (m.gpus || []).length) {
      const gpuTemps = (m.gpus || []).map((g) => g.temp).filter((t) => t != null);
      const gpuHot = gpuTemps.some((t) => t >= GPU_HOT_C);
      if (m.cpuTemp != null) {
        const hot = m.cpuTemp >= HOT_C || gpuHot;
        out.push(tile({ label: 'Heat', value: Math.round(m.cpuTemp), unit: '°C', hot,
          flag: gpuHot ? '▲ GPU hot' : heatFlag(m.cpuTemp, HOT_C),
          sub: gpuTemps.length ? `CPU · GPU ${gpuTemps.map(deg).join(' ')}` : 'CPU',
          chart: spark(series(m, 'temp'), { lo: 30, hi: 100, stroke: hot ? 'var(--bad)' : c, fmt: deg, title: `${m.name} CPU heat`,
            marks: [{ v: HOT_C, color: 'var(--bad)' }] }) }));
      } else if (gpuTemps.length) {
        out.push(tile({ label: 'Heat', value: Math.round(Math.max(...gpuTemps)), unit: '°C', hot: gpuHot,
          flag: heatFlag(Math.max(...gpuTemps), GPU_HOT_C), sub: 'GPU' }));
      } else {
        out.push(tile({ label: 'Heat', value: '–', sub: 'no sensor', none: true }));
      }
    }
    return out.length ? el('div', { class: 'tiles4', style: { gridTemplateColumns: `repeat(${out.length}, minmax(0, 1fr))` } }, ...out) : null;
  }

  // The busiest programs as bars against one full core (a program on several cores runs past 100%).
  function busiest(m) {
    const list = m.busiest || [];
    if (!list.length) return null;
    const scale = Math.max(100, ...list.map((p) => p.cpu));
    const grid = el('div', { class: 'procs' }, el('div', { class: 'pl', text: 'busiest programs · % of one core' }));
    for (const p of list) {
      grid.append(el('div', { class: 'pn', text: p.name, title: `${p.name} (pid ${p.pid})` }),
        meter(p.cpu / scale, color(m.name), `${p.cpu}% of one core`), el('div', { class: 'pv', text: `${p.cpu}%` }));
    }
    return grid;
  }

  function meter(share, fill, title) {
    return el('div', { class: 'meter', title }, el('i', { style: { width: `${Math.max(0, Math.min(1, share)) * 100}%`, background: fill } }));
  }

  function machineRows() {
    const wrap = el('div', { class: 'mgrid' });
    for (const m of status.machines) {
      const card = el('div', { class: 'mcard' });
      const head = el('div', { class: 'mhead' }, el('div', { class: 'mname' }, el('span', { class: 'dot', style: { background: color(m.name) } }), m.name));
      card.append(head);
      if (!m.ok) {
        card.append(el('div', { class: 'mmeta err', text: m.error || 'no answer' }));
        wrap.append(card);
        continue;
      }
      const running = m.jobs.filter((j) => (j.state || 'running') === 'running').length;
      if (!m.virtual) head.append(el('span', { class: 'chip', text: `${running} running${m.draining ? ' · draining' : ''}` }));
      if (m.hot) head.append(el('span', { class: 'chip hot', text: `▲ hot: ${m.hot}` }));
      const lines = [];
      if (m.slots && m.slots.total) {
        const blocks = el('div', { class: 'slots', title: `${m.slots.used} of ${m.slots.total} ${m.slots.label || 'slots'} in use`,
          style: { width: `${Math.min(110, m.slots.total * 8)}px` } });
        for (let i = 0; i < m.slots.total; i++) blocks.append(el('i', { style: i < m.slots.used ? { background: color(m.name) } : null }));
        head.append(el('span', { class: 'chip', style: { marginLeft: 'auto' }, text: `${m.slots.used}/${m.slots.total} ${m.slots.label || 'slots'}` }), blocks);
      }
      const others = m.jobs.filter((j) => !j.size).length;     // jobs not holding a slot: runner services
      if (m.slots && others) lines.push(`${others} on runner services`);
      if (m.meter && m.meter.max) {
        const share = m.meter.value / m.meter.max;
        card.append(el('div', { class: 'vrow' }, meter(share, share < 0.15 ? 'var(--bad)' : share < 0.3 ? 'var(--warn)' : color(m.name), m.meter.label),
          el('span', { class: 'chip', text: `${m.meter.value} of ${m.meter.max} ${m.meter.label || ''}`.trim() })));
      } else if (m.load != null && m.cores && m.cpu == null) {
        card.append(el('div', { class: 'vrow' }, meter(m.load / m.cores, color(m.name), 'load against cores'),
          el('span', { class: 'chip', text: `load ${m.load} on ${m.cores} cores` })));
      }
      const t = tiles(m);
      if (t) card.append(t);
      const b = busiest(m);
      if (b) card.append(b);
      if (m.note) lines.push(m.note);
      if (lines.length) card.append(el('div', { class: 'mmeta', text: lines.join(' · ') }));
      for (const w of m.warnings || []) card.append(el('div', { class: 'mmeta warn', text: `⚠ ${w}` }));
      wrap.append(card);
    }
    return wrap;
  }

  // ---- one job as a row: a mark, what it is, where it ran and when. Every list of jobs is made of these.
  const RESULT_WORD = { success: 'passed', failure: 'failed', cancelled: 'was cancelled' };
  const resultWord = (r) => RESULT_WORD[r] || `ended ${r || 'unknown'}`;
  const laneOf = (lane, long) => (!lane ? null : long ? (LANES[String(lane).toLowerCase()] || [String(lane)])[0] : String(lane).toLowerCase());
  const machineFill = (name) => (names.includes(name) ? color(name) : 'var(--ink-3)');
  const mark = {
    machine: (name, dim) => el('i', { class: 'lead dot', style: { background: machineFill(name), opacity: dim ? 0.4 : null } }),
    waiting: () => el('i', { class: 'lead ring' }),
    result: (r) => (r === 'success' ? icon('check', 'lead ok') : r === 'failure' ? icon('x', 'lead no') : icon('dash', 'lead na')),
  };

  function jobLine(lead, j, where, when, tail = []) {
    return el(safe(j.url) ? 'a' : 'div', { class: 'jl', href: safe(j.url), target: '_blank', rel: 'noopener noreferrer' },
      lead,
      el('div', { class: 'what' }, el('b', { text: short(j.repo) }), el('span', { text: ` ${j.job}` }), ...(j.release ? [' ', el('span', { class: 'rel', text: 'Release' })] : [])),
      el('div', { class: 'spot', text: where || '' }),
      el('div', { class: 'when', text: when || '' }),
      ...tail);
  }

  // Running now, each with how far along it is against that job's usual time. `long` spells out the lane and the
  // usual time; the panel keeps both short.
  function liveRows(live, now, long) {
    const usual = usualTimes();
    return live.map((j) => {
      const running = j.phase === 'running', elapsed = j.since ? now - j.since : null;
      const norm = running && elapsed != null ? usual(j) : null, over = norm && elapsed > norm * 1.5;
      const share = norm ? Math.min(1, elapsed / norm) : null;
      const when = !running ? j.phase : elapsed == null ? '' : norm && long ? `${dur(elapsed)} of ~${dur(norm)}` : dur(elapsed);
      const bar = el('div', { class: 'bar' }, el('i', { style: {
        width: share == null ? '100%' : `${Math.max(3, share * 100)}%`,
        background: over ? 'var(--warn)' : machineFill(j.machine), opacity: share == null ? 0.22 : 1 } }));
      const row = jobLine(mark.machine(j.machine, !running), j, [j.machine, laneOf(j.lane, long)].filter(Boolean).join(' · '), when, running ? [bar] : []);
      return hoverable(row, [j.repo, [j.machine, j.label].filter(Boolean).join(' · '),
        !running ? (j.phase === 'starting' ? 'starting: its machine is booting, or it waits for GitHub to hand it the job' : j.phase)
          : `running ${dur(elapsed || 0)}${norm ? `; usually ${dur(norm)}${over ? ' (running long)' : ''}` : ''}`].join('\n'));
    });
  }

  function doneRows(done, now, long) {
    return done.map((j) => hoverable(
      jobLine(mark.result(j.result), j, [j.machine, laneOf(j.lane), long && j.started ? `took ${dur(j.finished - j.started)}` : null].filter(Boolean).join(' · '),
        `${age(now - j.finished)} ago`),
      () => tipFor({ ...j, s: j.started, e: j.finished }, now)));
  }

  // Waiting in line: how long, and the queue's own words for why. `full` lets a long reason run onto more lines.
  function waitRows(queued, full) {
    return queued.map((j) => jobLine(mark.waiting(), { repo: j.repo, job: j.job_name || 'job', url: j.url, release: j.is_release },
      j.attempt > 1 ? `attempt ${j.attempt}` : '', j.waited_s != null ? waitFmt(j.waited_s) : '',
      [el('div', { class: `sub${full ? ' full' : ''}`, text: j.wait_reason || 'The queue has not said why yet.', title: j.wait_reason || null })]));
  }

  // ---- the last hour as swimlanes: one band per machine, jobs packed into lanes
  function timeline(now, all) {
    const W = width(), span = 3600, t0 = now - span, label = 84, bandGap = 12, axis = 16, maxLanes = 10;
    const plotW = W - label - 4;
    const x = (t) => label + ((Math.max(t, t0) - t0) / span) * plotW;
    const bands = names.map((m) => {
      const jobs = all.filter((j) => j.machine === m && j.e > t0).sort((a, b) => a.s - b.s);
      const ends = [];
      for (const j of jobs) {
        let lane = ends.findIndex((e) => e <= j.s - 20);
        if (lane < 0) lane = ends.length < maxLanes ? ends.push(0) - 1 : ends.indexOf(Math.min(...ends));
        ends[lane] = Math.max(ends[lane], j.e);
        j.lane = lane;
      }
      const lanes = Math.max(1, ends.length);
      const laneH = lanes > 6 ? 5 : 7, gap = lanes > 6 ? 2 : 3;
      return { m, jobs, lanes, laneH, gap, h: lanes * (laneH + gap) - gap };
    });
    const H = bands.reduce((h, b) => h + b.h + bandGap, 0) - bandGap + axis + 4;
    const svg = el('svg:svg', { width: '100%', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Jobs in the last hour, by machine' });
    for (let k = 0; k <= 4; k++) {
      const gx = x(t0 + (span * k) / 4);
      svg.append(el('svg:line', { x1: gx, x2: gx, y1: 0, y2: H - axis, stroke: 'var(--grid)', 'stroke-width': 1 }));
      svg.append(el('svg:text', { x: gx, y: H - 3, 'text-anchor': k === 0 ? 'start' : k === 4 ? 'end' : 'middle', text: k === 4 ? 'now' : `${60 - k * 15}m ago` }));
    }
    let y0 = 0;
    for (const band of bands) {
      const mid = y0 + Math.min(band.h, 8) / 2;
      svg.append(el('svg:circle', { cx: 4, cy: mid, r: 4, fill: color(band.m) }));
      svg.append(el('svg:text', { x: 13, y: mid + 3.5, style: 'fill: var(--ink-2); font-weight: 600', text: band.m.length > 11 ? `${band.m.slice(0, 10)}…` : band.m }));
      if (!band.jobs.length) svg.append(el('svg:line', { x1: label, x2: label + plotW, y1: mid, y2: mid, stroke: 'var(--track)', 'stroke-width': 2, 'stroke-linecap': 'round' }));
      for (const j of band.jobs) {
        const bx = x(j.s), bw = Math.max(3, x(j.e) - bx), by = y0 + j.lane * (band.laneH + band.gap);
        const failed = j.result === 'failure';
        const fill = failed ? 'var(--bad)' : j.live || j.result === 'success' ? color(band.m) : 'var(--gone)';
        const bar = el('svg:rect', { x: bx, y: by, width: bw, height: band.laneH, rx: Math.min(3, band.laneH / 2), fill,
          'fill-opacity': j.live || failed ? 1 : 0.4, style: safe(j.url) ? 'cursor:pointer' : null });
        hoverable(bar, () => tipFor(j, Date.now() / 1000));
        bar.addEventListener('click', () => open(j.url));
        svg.append(bar);
        if (j.live) svg.append(el('svg:circle', { class: 'live', cx: bx + bw - 1, cy: by + band.laneH / 2, r: band.laneH * 0.65, fill: color(band.m), 'pointer-events': 'none' }));
      }
      y0 += band.h + bandGap;
    }
    return svg;
  }

  // ---- the last 6 hours: one tile per finished job, oldest first
  function results() {
    const done = status.history;
    if (!done.length) return el('div', { class: 'empty', text: 'No jobs finished in the last 6 hours.' });
    const passed = done.filter((j) => j.result === 'success').length;
    const failed = done.filter((j) => j.result === 'failure').length;
    const other = done.length - passed - failed;
    const times = done.filter((j) => j.started).map((j) => j.finished - j.started);
    const tally = el('div', { class: 'tally' },
      el('span', {}, el('span', { class: 'ok-i', text: '✓ ' }), el('b', { text: passed }), ' passed'),
      el('span', {}, el('span', { class: 'bad-i', text: '✗ ' }), el('b', { text: failed }), ' failed'));
    if (other) tally.append(el('span', {}, '– ', el('b', { text: other }), ' cancelled'));
    if (times.length) tally.append(el('span', { style: { marginLeft: 'auto' } }, 'median ', el('b', { text: dur(median(times)) })));
    const tiles = el('div', { class: 'tiles', role: 'list', 'aria-label': 'Finished jobs, oldest first' });
    for (const j of done) {
      const tile = el(safe(j.url) ? 'a' : 'span', { href: safe(j.url), target: '_blank', rel: 'noopener', role: 'listitem',
        style: { background: resultColor[j.result] || 'var(--gone)', opacity: j.result === 'success' ? 0.55 : 1 },
        'aria-label': `${short(j.repo)} ${j.job} ${j.result}` });
      tiles.append(hoverable(tile, () => tipFor({ ...j, s: j.started, e: j.finished }, 0)));
    }
    return el('div', {}, tally, tiles);
  }

  function showTip(ev, text) {
    const [first, ...rest] = text.split('\n');
    tip.replaceChildren(el('b', { text: first }), rest.length ? `\n${rest.join('\n')}` : '');
    tip.style.opacity = 1;
    const r = tip.getBoundingClientRect();
    let left = ev.clientX + 12, top = ev.clientY + 14;
    if (left + r.width > innerWidth - 6) left = ev.clientX - r.width - 12;
    if (top + r.height > innerHeight - 6) top = ev.clientY - r.height - 10;
    tip.style.left = `${Math.max(6, left)}px`;
    tip.style.top = `${Math.max(6, top)}px`;
  }
  function hideTip() { tip.style.opacity = 0; }

  function freshness() {
    const age = status ? Date.now() / 1000 - status.updated : 0;
    const stale = age > 30 || !!problem;
    document.documentElement.classList.toggle('stale', stale);      // every lamp turns red and stops pulsing
    const node = document.querySelector('.fresh');
    if (!node) return;
    node.classList.toggle('stale', stale);
    if (!status) node.textContent = '';
    else if (host) node.textContent = age < 10 ? 'updated just now' : `updated ${dur(age)} ago`;
    else node.textContent = age < 2 ? 'Updated just now' : `Updated ${dur(age)} ago`;
  }

  // The menu bar app sizes its panel to the page; T3's card does the same.
  function reportHeight() {
    // The page's own content, not the document: in the panel the body fills the window, so the document is never
    // shorter than the panel and the panel could only grow.
    const height = Math.ceil(app.offsetTop + app.offsetHeight + parseFloat(getComputedStyle(document.body).paddingBottom));
    window.webkit?.messageHandlers?.lanes?.postMessage({ height });
    if (host === 'embed') parent.postMessage({ type: 'lanes-height', height }, '*');
  }

  // ---- one picture of CI, for the panel and the dashboard alike: what is running, what just finished, who is
  // online and what needs a look. The queue knows a job's runner and lane; a machine knows the jobs on it. A job
  // both report is shown once, with what each of them knows.
  const opened = new Set((() => { try { return JSON.parse(localStorage.getItem('lanes-open') || '[]'); } catch { return []; } })());
  const saveOpened = () => { try { localStorage.setItem('lanes-open', JSON.stringify([...opened])); } catch {} };
  const real = () => status.machines.filter((m) => !m.virtual);
  const heatOf = (m) => {
    const temps = [m.cpuTemp, ...(m.gpus || []).map((g) => g.temp)].filter((t) => t != null);
    return temps.length ? Math.max(...temps) : null;
  };

  function liveJobs() {
    const q = status.queue;
    const rows = ((q && q.running) || []).map((j) => ({ repo: j.repo, job: j.job_name || 'job', machine: j.claimed_by || null, lane: j.claimed_lane || null,
      since: j.started_at || j.claimed_at || null, phase: j.state === 'RUNNING' ? 'running' : j.state === 'TEARING_DOWN' ? 'cleaning up' : 'starting',
      url: j.url, release: !!j.is_release }));
    const matched = new Set(), extra = [];
    for (const m of status.machines) {
      for (const j of m.jobs) {
        const twin = rows.find((r) => !matched.has(r) && r.repo === j.repo && r.job === j.job && (!r.machine || r.machine === m.name));
        if (twin) {
          matched.add(twin);
          Object.assign(twin, { machine: m.name, since: twin.since || j.since || null, url: twin.url || j.url, label: j.label });
          continue;
        }
        const starting = j.state === 'starting';
        extra.push({ repo: j.repo, job: j.job || (starting ? 'starting…' : 'job'), machine: m.name, lane: null, since: j.since || null,
          phase: starting ? 'starting' : 'running', url: j.url, label: j.label });
      }
    }
    return [...rows, ...extra].sort((a, b) => (a.since || Infinity) - (b.since || Infinity));
  }

  const ENDED = { DONE: 'success', FAILED: 'failure', CANCELLED: 'cancelled' };
  let doneOf = null, doneList = [];
  function doneJobs() {
    if (doneOf === status) return doneList;
    const q = status.queue;
    const rows = ((q && q.recent) || []).filter((j) => ENDED[j.state] && j.finished_at).map((j) => ({ repo: j.repo, job: j.job_name || 'job',
      machine: j.claimed_by || null, lane: j.claimed_lane || null, started: j.started_at || null, finished: j.finished_at, result: ENDED[j.state], url: j.url }));
    const matched = new Set(), extra = [];
    for (const h of status.history) {
      const twin = rows.find((r) => !matched.has(r) && r.repo === h.repo && r.job === h.job && Math.abs(r.finished - h.finished) < 300);
      if (twin) {
        matched.add(twin);
        Object.assign(twin, { machine: twin.machine || h.machine, started: twin.started || h.started, url: twin.url || h.url, label: h.label });
        continue;
      }
      extra.push({ repo: h.repo, job: h.job, machine: h.machine, lane: null, started: h.started, finished: h.finished, result: h.result, url: h.url, label: h.label });
    }
    doneOf = status;
    doneList = [...rows, ...extra].sort((a, b) => b.finished - a.finished);
    return doneList;
  }

  // Runners when the hub reads a queue, else the machines themselves.
  function fleet() {
    const workers = (status.queue && status.queue.workers) || [];
    if (workers.length) return { online: workers.filter((w) => w.online).length, total: workers.length, word: 'runner' };
    return { online: real().filter((m) => m.ok).length, total: real().length, word: 'machine' };
  }

  // What needs a look, one line per machine: a runner that is offline, paused or draining, else a machine that is
  // silent or hot. A queue that stopped answering comes first.
  function alerts() {
    const by = new Map(), q = status.queue;
    for (const m of real()) {
      const top = (m.busiest || [])[0];
      if (!m.ok) by.set(m.name, `${m.name} is not answering`);
      else if (m.hot) by.set(m.name, `${m.name} is running hot: ${m.hot}${top ? ` · busiest: ${top.name} ${top.cpu}%` : ''}`);
    }
    for (const w of (q && q.workers) || []) {
      if (!w.online) by.set(w.worker_id, `${w.worker_id} is offline${typeof w.age_s === 'number' ? `, last heard from ${dur(w.age_s)} ago` : ''}`);
      else if (w.paused_reason) by.set(w.worker_id, `${w.worker_id} is paused: ${w.paused_reason.replace(/^paused:?\s*/i, '')}`);
      else if (w.draining) by.set(w.worker_id, `${w.worker_id} is draining: finishing its jobs and taking no new ones`);
    }
    const out = [...by.values()];
    if (q && q.error) out.unshift(`The queue is not answering (${q.error})${(q.workers || []).length ? '. Showing its last good reading' : ''}`);
    return out;
  }

  function pulse() {
    const live = liveJobs(), queued = (status.queue && status.queue.queued) || [], done = doneJobs(), warn = alerts();
    return { live, queued, done, warn, fleet: fleet(), active: live.length + queued.length > 0, last: done[0] || null,
      tone: problem ? 'bad' : warn.length ? 'warn' : 'good' };
  }

  const countsText = (p) => [`${p.live.length} running`, status.queue ? `${p.queued.length} waiting` : null].filter(Boolean).join(' · ');
  // "web e2e passed 14m ago on build-01", with a failure in red.
  const lastJob = (j, now) => [el('b', { text: short(j.repo) }), ` ${j.job} `, el('span', { class: j.result === 'failure' ? 'bad-t' : null, text: resultWord(j.result) }),
    ` ${age(now - j.finished)} ago${j.machine ? ` on ${j.machine}` : ''}`];
  const tallyText = (done) => `${done.filter((j) => j.result === 'success').length} passed, ${done.filter((j) => j.result === 'failure').length} failed`;

  // ---- compact layout (menu bar panel, a card in another app): is CI alive, what is running, what just finished,
  // then each machine at a glance with its details on click. The dashboard is one click away in the browser.
  function compactHead(p, now) {
    const f = p.fleet;
    const title = problem ? "Can't reach the Lanes hub"
      : p.active ? countsText(p)
      : f.total && !f.online ? `No ${f.word} is online`
      : `All caught up · ${f.online === f.total ? plural(f.total, f.word) : `${f.online} of ${plural(f.total, f.word)}`} online`;
    const sub = problem ? [`Showing what it last said, at ${clock.format(status.updated * 1000)}`]
      : p.active ? null
      : p.last ? ['Last job: ', ...lastJob(p.last, now)]
      : ['No job has finished in the last 6 hours'];
    return el('div', { class: 'c-head' }, el('i', { class: `lamp on ${p.tone}` }),
      el('div', {}, el('div', { class: 'c-title', text: title }), sub ? el('div', { class: 'c-sub' }, ...sub) : null,
        ...p.warn.slice(0, 2).map((text) => el('div', { class: 'c-alert', text }))),
      el('div', { class: 'fresh' }));
  }

  function cell(text, share, fill, cls) {
    if (text == null) return el('div', { class: 'cell na', text: '–' });
    return el('div', { class: `cell${cls ? ` ${cls}` : ''}` }, text,
      el('i', {}, el('b', { style: { width: `${Math.max(2, Math.min(1, share) * 100)}%`, background: fill } })));
  }

  // Why the machine is busy, in a few words: its busiest program, else its CI jobs, else idle.
  function why(m) {
    const top = (m.busiest || [])[0];
    const running = m.jobs.filter((j) => (j.state || 'running') === 'running').length;
    const parts = [];
    if (top) parts.push(`${top.name} ${top.cpu}%`);
    if (running) parts.push(`${running} CI job${running === 1 ? '' : 's'}`);
    return parts.join(' · ') || 'idle';
  }

  function details(m) {
    const c = color(m.name);
    const chart = (label, key, now, fmt, opts = {}) => {
      const pts = series(m, key);
      if (now == null && pts.length < 2) return null;
      const peak = pts.length ? Math.max(...pts.map((p) => p[1])) : null;
      return el('div', {}, el('div', { class: 'lab' }, el('span', {}, el('b', { text: label }), now != null ? `  ${fmt(now)}` : ''),
        el('span', { text: peak != null ? `peak ${fmt(peak)}` : '' })),
        spark(pts, { stroke: c, fmt, title: `${m.name} ${label}`, ...opts }));
    };
    const free = m.memFreeGiB, total = m.memGiB;
    const memNow = free != null && total ? (100 * (total - free)) / total : null;
    const gpu = (m.gpus || [])[0];
    const multi = el('div', { class: 'multi' }, ...[
      chart('CPU', 'cpu', m.cpu, pct),
      gpu ? chart('GPU', 'gpu', gpu.busy, pct) : null,
      chart('Memory', 'mem', memNow, pct),
      chart('Heat', 'temp', m.cpuTemp, deg, { lo: 30, hi: 100, marks: [{ v: HOT_C, color: 'var(--bad)' }],
        stroke: m.cpuTemp >= HOT_C ? 'var(--bad)' : c }),
    ].filter(Boolean));
    const facts = [];
    if (m.cores) facts.push(`${m.cores} cores, load ${m.load}`);
    if (total) facts.push(`memory ${Math.round(total - free)} of ${Math.round(total)} GB`);
    for (const g of m.gpus || []) facts.push(`${g.name}${g.memUsedGiB != null && g.memGiB ? `, ${g.memUsedGiB} of ${Math.round(g.memGiB)} GB` : ''}${g.temp != null ? `, ${deg(g.temp)}` : ''}`);
    if (m.slots && m.slots.total) facts.push(`CI: ${m.slots.used} of ${m.slots.total} ${m.slots.label || 'slots'} in use`);
    if (m.cpuTemp == null && !(m.gpus || []).some((g) => g.temp != null)) facts.push('no heat sensor');
    if (m.note) facts.push(m.note);
    const more = el('div', { class: 'mt-more' }, el('div', { class: 'kv', text: facts.join(' · ') }), multi);
    const b = busiest(m);
    if (b) more.append(b);
    for (const w of m.warnings || []) more.append(el('div', { class: 'mmeta warn', text: `⚠ ${w}` }));
    return more;
  }

  function machineTable() {
    const wrap = el('div', { class: 'c-machines' }, el('div', { class: 'mt-cols' }, el('span', { text: 'Machines' }),
      ...['CPU', 'GPU', 'Memory', 'Heat'].map((t) => el('span', { text: t })), el('span')));
    for (const m of real()) {
      const block = el('div', { class: `mt${opened.has(m.name) ? ' open' : ''}${m.hot || !m.ok ? ' trouble' : ''}` });
      const name = el('div', { class: 'mt-name' }, el('div', { class: 'mname' }, el('span', { class: 'dot', style: { background: color(m.name) } }), m.name));
      let cells;
      if (!m.ok) {
        name.append(el('div', { class: 'mt-why', style: { color: 'var(--bad)' }, text: m.error || 'no answer' }));
        cells = [cell(null), cell(null), cell(null), cell(null)];
      } else {
        name.append(el('div', { class: 'mt-why', text: why(m) }));
        const gpu = (m.gpus || []).map((g) => g.busy).filter((v) => v != null);
        const memShare = m.memFreeGiB != null && m.memGiB ? 1 - m.memFreeGiB / m.memGiB : null;
        const heat = heatOf(m);
        const hotNow = !!m.hot;
        cells = [
          cell(m.cpu != null ? pct(m.cpu) : null, (m.cpu || 0) / 100, color(m.name)),
          cell(gpu.length ? pct(Math.max(...gpu)) : null, Math.max(0, ...gpu) / 100, color(m.name)),
          cell(memShare != null ? pct(memShare * 100) : m.memFreeGiB != null ? `${Math.round(m.memFreeGiB)} GB` : null, memShare ?? 0, color(m.name)),
          cell(heat != null ? `${hotNow ? '▲ ' : ''}${Math.round(heat)}°` : null, (heat - 30) / 70,

        el('div', { class: 'vrow' }, el('div', { class: 'mname' }, el('span', { class: 'dot', style: { background: color(m.name) } }), m.name),

  function renderCompact(now) {

  const ICONS = {

  // Rebuilding part of the page drops keyboard focus. Put it back on the same control: the node itself when it

  function keepFocus(root, rebuild) {

  const TABS = [['prs', 'Pull Requests'], ['ci', 'Live CI & Queue'], ['flow', 'How CI Works']];
  const ui = { tabs: {}, views: {} };
  const scrolls = {};
  let tab = null;
  let tabChosen = false;                        // by a click or the address; until then the default follows the data
  let prs = null;
  let scopeCount = null;                        // the pull requests the PR view counts, bots left out when hidden

  const defaultTab = () => (prs ? (prs.configured ? 'prs' : 'ci') : status ? (status.pr_summary ? 'prs' : 'ci') : problem ? 'ci' : null);

  function buildShell() {

  // The brand mark is the menu bar glyph: one lane per machine, as long as its share of the running jobs.
  function brandGlyph() {
    const rows = (status ? real() : []).slice(0, 4).map((m) => m.jobs.filter((j) => (j.state || 'running') === 'running').length);
    if (!rows.length) rows.push(0, 0, 0);
    const lane = rows.length > 3 ? 2.5 : 3, gap = rows.length > 3 ? 2 : 2.5, peak = Math.max(4, ...rows);

  // The top bar says it in one line: the lamp, what CI is doing, and how fresh that is. The line opens the CI view.

  }

  // ---- pull requests: a rail of repositories, one row of views, then one entry per open PR with its proof video or
  // screenshots on a dark stage. An entry is built once and kept until that PR's data changes, and its stage is kept

  const savedPrs = (() => { try { return JSON.parse(localStorage.getItem('lanes-prs') || '{}') || {}; } catch { return {}; } })();

  const failing = (p) => (p.ci || {}).state === 'failing' || p.mergeable === 'CONFLICTING';
  const VIEWS = [
    ['all', 'All', () => true],
    ['proof', 'With proof', (p) => p.has_proof],
    ['ready', 'Ready', (p) => p.merge_ready],
    ['failing', 'Failing', failing],

  let cards = new Map();                        // PR id -> { sig, pr, node, hay, proof, mediaSig }
  let prsSig = '';
  let pendingPrs = null;                        // newer data, held back while a video plays or the viewer is busy
  let prsProblem = null;
  let manyAuthors = false;                      // more than one person has PRs open, so an entry says whose it is
  let lb = null;                                // the open screenshot viewer
  const isPlaying = (v) => !v.paused && !v.ended;
  const prBusy = () => !!lb || document.activeElement === ui.search || [...ui.prList.querySelectorAll('video')].some(isPlaying);

  function buildPrView() {
    ui.prTitle = el('h1', { text: 'Pull requests' });

  function clearFilters() {

  // The one thing to know about a PR, most pressing first. The checks bar in its last line still tells the rest.
  function prStatus(p) {
    const ci = (p.ci || {}).state;
    if (ci === 'failing') return ['CI failing', 'bad'];
    if (p.mergeable === 'CONFLICTING') return ['Merge conflicts', 'bad'];
    if (p.is_draft) return ['Draft', 'none'];
    if (ci === 'running') return ['CI running', 'info'];
    if (p.merge_ready) return ['Ready', 'good'];
    if (p.review_decision === 'CHANGES_REQUESTED') return ['Changes requested', 'warn'];
    if (p.review_decision === 'REVIEW_REQUIRED') return ['Waiting on review', ''];

  // A video loads its first frame only once its card is near the screen, so a long feed doesn't fetch every proof at once.
  const lazy = 'IntersectionObserver' in window ? new IntersectionObserver((entries) => {
    for (const entry of entries) {

  const GENERIC_LABEL = new Set(['Proof video', 'Screenshot']);
  function caption(m) {

    const btn = el('button', { class: 'frame', type: 'button', 'aria-label': `Zoom in: ${m.label || 'screenshot'}` }, img,

  // The stage: videos full width (side by side when there are two or more, such as before and after), screenshots

  function proofStage(media) {

  }

  const CHECK_WORD = { passing: 'passed', failing: 'failed', running: 'running', pending: 'not started' };

  function mergeLine(p) {
    const base = p.base_ref || 'the base branch', said = [];
    if (p.merge_ready) {

      said.push(`Ready to merge into ${base}.`);
    } else {
      if (p.is_draft) said.push('Still a draft.');
      if (p.mergeable === 'CONFLICTING') said.push(`Has merge conflicts with ${base}.`);
      if (p.review_decision === 'CHANGES_REQUESTED') said.push('A reviewer asked for changes.');
      else if (p.review_decision === 'APPROVED') said.push('Approved.');
      else if (p.review_decision === 'REVIEW_REQUIRED') said.push('Waiting on review.');
    }
    return said.length ? el('p', { class: 'mergeline', text: said.join(' ') }) : null;
  }

  // A quiet toggle in an entry's last line, with its panel under that line. What is open survives a rebuild.
  const opens = new Map();                      // PR id -> the panels open on its entry
  function disclose(p, key, label, body) {
    const isOpen = (opens.get(p.id) || new Set()).has(key);
    const panel = el('div', { class: 'pr-more', id: `${key}:${p.id}`, hidden: isOpen ? null : '' }, ...body);
    const btn = el('button', { class: 'disc', type: 'button', 'aria-expanded': String(isOpen), 'aria-controls': panel.id, 'data-k': `${key}:${p.id}` }, ...label, icon('chev'));
    btn.addEventListener('click', () => {
      const set = opens.get(p.id) || new Set();
      if (set.has(key)) set.delete(key); else set.add(key);
      opens.set(p.id, set);
      btn.setAttribute('aria-expanded', String(set.has(key)));
